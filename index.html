<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>測試</title>
    <style>
        body { background: #030712; color: white; font-family: sans-serif; padding: 40px; text-align: center; }
        .btn { padding: 14px 28px; background: #2563eb; color: white; border: none; border-radius: 10px; font-size: 16px; cursor: pointer; margin: 8px; }
        .btn:hover { background: #1d4ed8; }
        #result { margin-top: 20px; padding: 20px; background: #0b1329; border-radius: 10px; display: none; }
    </style>
</head>
<body>
    <h1>按鈕測試</h1>
    <button class="btn" onclick="testClick('A')">按鈕 A</button>
    <button class="btn" onclick="testClick('B')">按鈕 B</button>
    <div id="result"></div>

    <script>
        function testClick(btn) {
            var result = document.getElementById('result');
            result.style.display = 'block';
            result.innerHTML = '✅ 按鈕 ' + btn + ' 被點擊了！腳本正常工作！';
            console.log('按鈕 ' + btn + ' 被點擊了');
        }
        console.log('腳本加載成功');
    </script>
</body>
</html>
