<html lang="zh-TW">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Viral Game Content Agent</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #030712;
            color: #f3f4f6;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            margin: 0;
            padding: 24px 16px;
            box-sizing: border-box;
        }
        .container {
            max-width: 1100px;
            width: 100%;
            background-color: #0b1329;
            border: 1px solid #1e293b;
            border-radius: 20px;
            padding: 32px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5), 0 0 30px rgba(59, 130, 246, 0.15);
            box-sizing: border-box;
        }
        h1 {
            font-size: 26px;
            font-weight: 800;
            margin-top: 0;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #38bdf8 0%, #818cf8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-align: center;
        }
        .desc {
            font-size: 14px;
            color: #9ca3af;
            margin-bottom: 20px;
            line-height: 1.5;
            text-align: center;
        }
        .main-layout {
            display: flex;
            gap: 28px;
            align-items: stretch;
        }
        .control-panel {
            width: 300px;
            flex-shrink: 0;
        }
        .chat-panel {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
        }
        @media (max-width: 820px) {
            .main-layout { flex-direction: column; }
            .control-panel { width: 100%; }
        }
        .label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #9fa8b6;
            margin-bottom: 8px;
        }
        select.input-field {
            width: 100%;
            background: #111827;
            border: 1px solid #374151;
            border-radius: 10px;
            padding: 14px;
            color: white;
            font-size: 14px;
            box-sizing: border-box;
            margin-bottom: 16px;
            outline: none;
            cursor: pointer;
        }
        .btn {
            width: 100%;
            color: white;
            border: none;
            border-radius: 10px;
            padding: 16px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            margin-bottom: 12px;
            box-sizing: border-box;
            transition: all 0.2s;
        }
        .btn:hover { transform: translateY(-1px); }
        .btn-hot { background: linear-gradient(135deg, #ef4444, #f97316); }
        .btn-hot:hover { box-shadow: 0 4px 20px rgba(239, 68, 68, 0.4); }
        .btn-upcoming { background: linear-gradient(135deg, #a855f7, #6366f1); }
        .btn-upcoming:hover { box-shadow: 0 4px 20px rgba(168, 85, 247, 0.4); }
        .btn-auto { background: linear-gradient(135deg, #10b981, #06b6d4); }
        .btn-auto:hover { box-shadow: 0 4px 20px rgba(16, 185, 129, 0.4); }
        .btn-auto:disabled { opacity: 0.5; cursor: not-allowed; transform: none; box-shadow: none; }
        .hint {
            font-size: 12px;
            color: #6b7280;
            line-height: 1.4;
            margin-top: -4px;
            margin-bottom: 20px;
        }
        .btn-hint {
            font-size: 11px;
            color: rgba(255,255,255,0.7);
            margin-top: 4px;
            font-weight: 400;
        }
        .divider {
            display: flex;
            align-items: center;
            margin: 20px 0;
            color: #4b5563;
            font-size: 12px;
        }
        .divider::before, .divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background: #1e293b;
        }
        .divider span { padding: 0 12px; }
        .proxy-status {
            font-size: 11px;
            padding: 8px 12px;
            border-radius: 6px;
            margin-bottom: 16px;
            word-break: break-all;
        }
        .proxy-ok { background: rgba(16, 185, 129, 0.1); color: #10b981; border: 1px solid rgba(16, 185, 129, 0.3); }
        .proxy-no { background: rgba(239, 68, 68, 0.1); color: #f43f5e; border: 1px solid rgba(239, 68, 68, 0.3); }
        /* ===== 自主生成區域 ===== */
        .auto-section {
            background: rgba(16, 185, 129, 0.06);
            border: 1px solid rgba(16, 185, 129, 0.25);
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 16px;
        }
        .auto-title {
            font-size: 13px;
            font-weight: 700;
            color: #10b981;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .auto-status {
            font-size: 12px;
            color: #94a3b8;
            margin-bottom: 6px;
            line-height: 1.5;
        }
        .auto-time {
            font-size: 11px;
            color: #64748b;
            margin-bottom: 10px;
        }
        /* ===== 聊天界面 ===== */
        .chat-container {
            display: flex;
            flex-direction: column;
            height: 680px;
            background: #070b14;
            border: 1px solid rgba(56, 189, 248, 0.3);
            border-radius: 12px;
            overflow: hidden;
        }
        .chat-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            border-bottom: 1px solid #1e293b;
            font-size: 13px;
            font-weight: 600;
            color: #38bdf8;
            background: #0b1329;
        }
        .chat-header-left {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .chat-badge {
            background: rgba(3, 105, 161, 0.4);
            color: #38bdf8;
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 4px;
        }
        .new-chat-btn {
            background: #1e293b;
            color: #94a3b8;
            border: 1px solid #334155;
            padding: 5px 12px;
            border-radius: 6px;
            font-size: 11px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .new-chat-btn:hover { background: #334155; color: white; }
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .chat-messages::-webkit-scrollbar { width: 6px; }
        .chat-messages::-webkit-scrollbar-track { background: transparent; }
        .chat-messages::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
        .message {
            max-width: 88%;
            display: flex;
        }
        .message-user {
            align-self: flex-end;
            justify-content: flex-end;
        }
        .message-ai {
            align-self: flex-start;
        }
        .message-content {
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.7;
            word-break: break-word;
        }
        .message-user .message-content {
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            color: white;
            border-bottom-right-radius: 4px;
        }
        .message-ai .message-content {
            background: #111827;
            color: #e2e8f0;
            border: 1px solid #1e293b;
            border-bottom-left-radius: 4px;
        }
        .message-ai .message-content h1,
        .message-ai .message-content h2,
        .message-ai .message-content h3 {
            color: #38bdf8;
            margin: 14px 0 8px;
        }
        .message-ai .message-content h2 { font-size: 17px; }
        .message-ai .message-content h3 { font-size: 15px; }
        .message-ai .message-content table {
            border-collapse: collapse;
            width: 100%;
            margin: 12px 0;
            font-size: 12px;
        }
        .message-ai .message-content th,
        .message-ai .message-content td {
            border: 1px solid #374151;
            padding: 8px 10px;
            text-align: left;
        }
        .message-ai .message-content th { background: #1e293b; color: #38bdf8; }
        .message-ai .message-content blockquote {
            background: #0f172a !important;
            color: #e2e8f0 !important;
            border-left: 3px solid #38bdf8;
            padding: 10px 14px;
            margin: 10px 0;
            border-radius: 0 6px 6px 0;
        }
        .message-ai .message-content a { color: #60a5fa; }
        .message-ai .message-content hr {
            border: none;
            border-top: 1px solid #1e293b;
            margin: 14px 0;
        }
        .message-ai .message-content ul,
        .message-ai .message-content ol {
            padding-left: 22px;
            margin: 8px 0;
            line-height: 1.8;
        }
        .message-ai .message-content li { margin-bottom: 4px; }
        .message-ai .message-content p { margin: 8px 0; }
        .chat-input-area {
            display: flex;
            gap: 8px;
            padding: 12px;
            border-top: 1px solid #1e293b;
            background: #0b1329;
        }
        .chat-input {
            flex: 1;
            background: #111827;
            border: 1px solid #374151;
            border-radius: 8px;
            padding: 10px 14px;
            color: white;
            font-size: 14px;
            outline: none;
        }
        .chat-input:focus { border-color: #38bdf8; }
        .chat-input:disabled { opacity: 0.5; }
        .send-btn {
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 10px 22px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .send-btn:hover { opacity: 0.9; }
        .send-btn:disabled { opacity: 0.4; cursor: not-allowed; }
        .typing-indicator {
            display: flex;
            gap: 5px;
            align-items: center;
            padding: 4px 0;
        }
        .typing-indicator span {
            width: 8px;
            height: 8px;
            background: #38bdf8;
            border-radius: 50%;
            animation: typing 1.4s infinite ease-in-out;
        }
        .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
        .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes typing {
            0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
            30% { transform: translateY(-6px); opacity: 1; }
        }
        .welcome-msg {
            color: #94a3b8;
            font-size: 13px;
            line-height: 1.7;
        }
        .welcome-msg strong { color: #38bdf8; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Viral Game Content Agent</h1>
        <div class="desc">Track 1: Audience Growth · Powered by Minds AI · 可持續對話討論企劃</div>
        <div class="main-layout">
            <div class="control-panel">
                <div id="proxyStatus" class="proxy-status proxy-no">⚠️ 代理未配置</div>


                <!-- ===== AI 定時自主生成區域 ===== -->
                <div class="auto-section">
                    <div class="auto-title">🤖 AI 定時自主生成</div>
                    <div id="autoStatus" class="auto-status">檢查中...</div>
                    <div id="autoTime" class="auto-time"></div>
                    <button type="button" id="autoViewBtn" class="btn btn-auto" onclick="viewAutoPlan()" disabled>
                        📄 查看最新自主企劃
                        <div class="btn-hint">AI 到點自動生成，無需手動按鈕</div>
                    </button>
                    <button type="button" id="runNowBtn" class="btn btn-auto" style="margin-top:8px;">
                        ▶️ Run now 手動觸發自主生成
                        <div class="btn-hint">測試定時生成邏輯</div>
                    </button>
                </div>


                <label class="label">搜尋模式</label>
                <select id="styleSelect" class="input-field">
                    <option value="high">🔥 爆款路線（熱門遊戲）</option>
                    <option value="low">🧊 冷門好評單機（在線人數少但好評率高）</option>
                </select>
                <div class="hint">爆款 = 熱門遊戲；冷門 = 在線人數少但好評率高的單機遊戲</div>
                <div class="divider"><span>一鍵生成企劃</span></div>
                <button type="button" class="btn btn-hot" onclick="onHotClick()">
                    🔥 當前遊戲
                    <div class="btn-hint">搜尋目前正在發售的遊戲</div>
                </button>
                <button type="button" class="btn btn-upcoming" onclick="onUpcomingClick()">
                    🚀 即將推出
                    <div class="btn-hint">搜尋未來 3-6 個月內發售的遊戲</div>
                </button>
            </div>
            <div class="chat-panel">
                <div class="chat-container">
                    <div class="chat-header">
                        <div class="chat-header-left">
                            <span>🤖 AI 對話</span>
                            <span class="chat-badge">MINDS</span>
                        </div>
                        <button class="new-chat-btn" onclick="newChat()">🗑️ 新對話</button>
                    </div>
                    <div id="chatMessages" class="chat-messages">
                        <div class="message message-ai">
                            <div class="message-content">
                                <div class="welcome-msg">
                                    你好！我是你的<strong>遊戲內容創作助手</strong>。<br><br>
                                    🎮 點擊左側按鈕一鍵生成遊戲企劃<br>
                                    💬 或直接在下方輸入訊息跟我討論<br>
                                    🔄 我會記住對話上下文，延續討論<br>
                                    ⏰ AI 也會定時自動生成最新企劃
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="chat-input-area">
                        <input type="text" id="chatInput" class="chat-input" placeholder="輸入訊息跟 AI 討論企劃..." onkeypress="if(event.key==='Enter')sendChatMessage()">
                        <button class="send-btn" id="sendBtn" onclick="sendChatMessage()">發送</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script>
        console.log("0️⃣ 腳本開始加載...");
        var PROXY_BASE = "https://winter-disk-958a.chunyin743.workers.dev";
        var MINDS_KEY = "";
        var MIND_ID = "64db433e-f36b-1410-8466-00039ce7df11";
        var HAS_PROXY = PROXY_BASE && PROXY_BASE !== "YOUR_WORKER_URL" && PROXY_BASE.length > 10;
        if (HAS_PROXY) {
            document.getElementById("proxyStatus").className = "proxy-status proxy-ok";
            document.getElementById("proxyStatus").textContent = "✅ 代理已配置：" + PROXY_BASE;
        }
        console.log("1️⃣ 代理狀態：" + (HAS_PROXY ? "已配置 ✅ " + PROXY_BASE : "未配置 ⚠️"));


        // 全局：當前輪詢定時器
        var currentPollTimer = null;
        var currentRequestId = 0;
        var cachedAutoPlan = null;


        // ===== 聊天界面函數 =====
        function addMessage(role, html) {
            var container = document.getElementById("chatMessages");
            var msgDiv = document.createElement("div");
            msgDiv.className = "message message-" + role;
            var contentDiv = document.createElement("div");
            contentDiv.className = "message-content";
            contentDiv.innerHTML = html;
            if (role === "ai") {
                var allElements = contentDiv.querySelectorAll("*");
                for (var i = 0; i < allElements.length; i++) {
                    allElements[i].style.background = "";
                    allElements[i].style.backgroundColor = "";
                    allElements[i].style.color = "";
                }
            }
            msgDiv.appendChild(contentDiv);
            container.appendChild(msgDiv);
            container.scrollTop = container.scrollHeight;
            return contentDiv;
        }
        function showTyping() {
            var container = document.getElementById("chatMessages");
            var msgDiv = document.createElement("div");
            msgDiv.className = "message message-ai";
            msgDiv.id = "typingIndicator";
            msgDiv.innerHTML = '<div class="message-content"><div class="typing-indicator"><span></span><span></span><span></span></div></div>';
            container.appendChild(msgDiv);
            container.scrollTop = container.scrollHeight;
        }
        function removeTyping() {
            var el = document.getElementById("typingIndicator");
            if (el) el.remove();
        }
        function setInputEnabled(enabled) {
            document.getElementById("chatInput").disabled = !enabled;
            document.getElementById("sendBtn").disabled = !enabled;
        }
        function newChat() {
            if (confirm("確定要開始新對話嗎？\n\n本地聊天記錄會被清空。\n（Minds 端對話歷史保留，AI 仍記得之前的內容）")) {
                document.getElementById("chatMessages").innerHTML =
                    '<div class="message message-ai"><div class="message-content"><div class="welcome-msg">你好！我是你的<strong>遊戲內容創作助手</strong>。<br><br>🎮 點擊左側按鈕一鍵生成遊戲企劃<br>💬 或直接在下方輸入訊息跟我討論<br>🔄 我會記住對話上下文，延續討論<br>⏰ AI 也會定時自動生成最新企劃</div></div></div>';
            }
        }

        //手動觸發自主生成
        document.getElementById("runNowBtn").addEventListener("click",async function(){
            console.log("🎯 Run now 手動觸發自主生成");
            try{
                const res = await fetch(PROXY_BASE+"/trigger-auto");
                const ret = await res.json();
                console.log("trigger-auto返回：",ret);
                alert(ret.msg || ret.error);
                setTimeout(checkAutoPlan,1500);
            }catch(err){
                alert("觸發失敗："+err.message);
            }
        });


        // ===== 檢查自主生成狀態 =====
        function checkAutoPlan() {
            if (!HAS_PROXY) {
                document.getElementById("autoStatus").textContent = "⚠️ 代理未配置";
                return;
            }
            fetch(PROXY_BASE + "/get-auto")
            .then(function(r) { return r.json(); })
            .then(function(data) {
                var statusEl = document.getElementById("autoStatus");
                var timeEl = document.getElementById("autoTime");
                var btn = document.getElementById("autoViewBtn");


                if (data.latest && data.latest.content) {
                    cachedAutoPlan = data.latest;
                    statusEl.innerHTML = "✅ 最新自主企劃已就緒";
                    statusEl.style.color = "#10b981";
                    if (data.latest.createdAt) {
                        var d = new Date(data.latest.createdAt);
                        timeEl.textContent = "生成時間：" + d.toLocaleString("zh-TW", { timeZone: "Asia/Hong_Kong" });
                    }
                    btn.disabled = false;
                } else if (data.pending && data.pending.sentAt) {
                    statusEl.innerHTML = "⏳ AI 正在生成中，請稍後刷新...";
                    statusEl.style.color = "#fbbf24";
                    var d = new Date(data.pending.sentAt);
                    timeEl.textContent = "發送時間：" + d.toLocaleString("zh-TW", { timeZone: "Asia/Hong_Kong" });
                    btn.disabled = true;
                } else {
                    statusEl.innerHTML = "📭 尚無自主生成紀錄";
                    statusEl.style.color = "#94a3b8";
                    timeEl.textContent = "等待定時任務執行（或手動 Run now）";
                    btn.disabled = true;
                }
            })
            .catch(function(e) {
                document.getElementById("autoStatus").textContent = "❌ 檢查失敗：" + e.message;
                document.getElementById("autoStatus").style.color = "#f43f5e";
            });
        }


        // ===== 查看自主企劃 =====
        function viewAutoPlan() {
            if (!cachedAutoPlan) return;
            addMessage("user", "🤖 <strong>[AI 定時自主生成]</strong> 查看最新自動企劃");
            addMessage("ai", cachedAutoPlan.content);
        }


        // ✅ callMinds：時間戳檢測 + 自動取消上一個輪詢
        function callMinds(prompt, onSuccess, onFail) {
            if (!HAS_PROXY) {
                onFail("proxy_not_configured");
                return;
            }
            if (currentPollTimer) {
                clearTimeout(currentPollTimer);
                currentPollTimer = null;
                console.log("🛑 已取消上一個輪詢");
            }
            var myRequestId = ++currentRequestId;
            console.log("🤖 發送消息到 Minds...");
            var messageText = "[source: webapp | tz: Asia/Hong_Kong]\n" + prompt;
            var headers = { "Content-Type": "application/json" };
            fetch(PROXY_BASE + "/minds/reply", { method: "POST", headers: headers })
            .then(function(r) { return r.json(); })
            .then(function(beforeData) {
                var beforeCreatedAt = beforeData.createdAt || "";
                console.log("📋 發送前基準時間:", beforeCreatedAt);
                return fetch(PROXY_BASE + "/minds/send", {
                    method: "POST",
                    headers: headers,
                    body: JSON.stringify({ mindId: MIND_ID, messageText: messageText })
                })
                .then(function(r) {
                    console.log("📡 發送狀態:", r.status);
                    return r.text().then(function(text) {
                        if (!r.ok) throw new Error("Send failed: " + text);
                        return JSON.parse(text);
                    });
                })
                .then(function() {
                    console.log("✅ 消息已發送，開始輪詢回覆...");
                    var attempts = 0;
                    var maxAttempts = 60;
                    function pollReply() {
                        if (myRequestId !== currentRequestId) {
                            console.log("🛑 輪詢被新請求取代，停止");
                            return;
                        }
                        attempts++;
                        fetch(PROXY_BASE + "/minds/reply", { method: "POST", headers: headers })
                        .then(function(r) { return r.json(); })
                        .then(function(data) {
                            var reply = data.reply || "";
                            var createdAt = data.createdAt || "";
                            console.log("📡 輪詢 #" + attempts + ", 時間:", createdAt, ", 長度:", reply.length);
                            if (reply && createdAt && createdAt !== beforeCreatedAt) {
                                console.log("✅ 收到新 AI 回覆");
                                currentPollTimer = null;
                                onSuccess(reply);
                            } else if (attempts < maxAttempts) {
                                currentPollTimer = setTimeout(pollReply, 5000);
                            } else {
                                currentPollTimer = null;
                                onFail("timeout");
                            }
                        })
                        .catch(function(e) {
                            console.warn("⚠️ 輪詢錯誤:", e.message);
                            if (attempts < maxAttempts) {
                                currentPollTimer = setTimeout(pollReply, 5000);
                            } else {
                                currentPollTimer = null;
                                onFail("minds_error", e.message);
                            }
                        });
                    }
                    currentPollTimer = setTimeout(pollReply, 5000);
                });
            })
            .catch(function(e) {
                console.warn("⚠️ 失敗:", e.message);
                currentPollTimer = null;
                onFail("minds_error", e.message);
            });
        }


        // 💬 用戶手動發送訊息
        function sendChatMessage() {
            var input = document.getElementById("chatInput");
            var text = input.value.trim();
            if (!text) return;
            input.value = "";
