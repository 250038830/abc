<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Viral Game Content Agent</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background-color: #030712; color: #f3f4f6; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 16px; box-sizing: border-box; }
        .container { max-width: 460px; width: 100%; background-color: #0b1329; border: 1px solid #1e293b; border-radius: 20px; padding: 32px; box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5), 0 0 30px rgba(59, 130, 246, 0.15); text-align: center; box-sizing: border-box; }
        h1 { font-size: 26px; font-weight: 800; margin-top: 0; margin-bottom: 8px; background: linear-gradient(135deg, #38bdf8 0%, #818cf8 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .desc { font-size: 14px; color: #9ca3af; margin-bottom: 28px; line-height: 1.5; }
        .label { display: block; font-size: 13px; font-weight: 600; color: #9fa8b6; margin-bottom: 8px; text-align: left; }
        .input-field { width: 100%; background: #111827; border: 1px solid #374151; border-radius: 10px; padding: 14px; color: white; font-size: 14px; box-sizing: border-box; margin-bottom: 16px; outline: none; }
        select.input-field { cursor: pointer; }
        .btn { width: 100%; background-color: #2563eb; color: white; border: none; border-radius: 10px; padding: 14px; font-size: 15px; font-weight: 700; cursor: pointer; margin-bottom: 12px; box-sizing: border-box; transition: background 0.2s; }
        .btn:hover { background-color: #1d4ed8; }
        .btn-upcoming { background-color: #a855f7; }
        .btn-upcoming:hover { background-color: #9333ea; }
        .btn-auto { background-color: #10b981; }
        .btn-auto:hover { background-color: #059669; }
        .hint { font-size: 12px; color: #6b7280; line-height: 1.4; margin-top: -4px; margin-bottom: 24px; text-align: left; }
        .output-box { display: none; background: #070b14; border: 1px solid rgba(56, 189, 248, 0.3); border-radius: 12px; padding: 20px; margin-top: 20px; box-shadow: inset 0 4px 10px rgba(0,0,0,0.8); text-align: left; }
        .output-header { display: flex; align-items: center; color: #38bdf8; font-weight: 700; font-size: 11px; border-bottom: 1px solid #1e293b; padding-bottom: 8px; margin-bottom: 12px; }
        .output-badge { background: rgba(3, 105, 161, 0.4); color: #38bdf8; font-size: 10px; padding: 2px 6px; border-radius: 4px; margin-left: auto; }
        .output-content { font-size: 14px; color: #e2e8f0; line-height: 1.6; white-space: pre-wrap; }
        .title-block { background: #111827; border-left: 4px solid #38bdf8; padding: 10px; margin-top: 10px; border-radius: 4px; }
        .t-red { border-left-color: #f43f5e; color: #f43f5e; font-weight: bold; }
        .t-yellow { border-left-color: #eab308; color: #eab308; font-weight: bold; }
        .t-green { border-left-color: #10b981; color: #10b981; font-weight: bold; }
        .t-gray { border-left-color: #64748b; }
        .t-gray span { color: #94a3b8; font-weight: bold; }
        .status-bar { font-size: 12px; color: #38bdf8; background: #111827; padding: 6px 12px; border-radius: 6px; margin-bottom: 14px; border: 1px solid #1e293b; display: inline-block; }
        .loading { color: #eab308; font-weight: bold; display: none; margin-top: 15px; text-align: center; font-size: 14px; }
        .steam-tag { display: inline-block; background: linear-gradient(135deg, #1b2838, #2a475e); color: #66c0f4; font-size: 10px; padding: 2px 8px; border-radius: 4px; margin-left: 6px; font-weight: 600; border: 1px solid #66c0f4; }
        .upcoming-tag { display: inline-block; background: linear-gradient(135deg, #581c87, #7e22ce); color: #e9d5ff; font-size: 10px; padding: 2px 8px; border-radius: 4px; margin-left: 6px; font-weight: 600; border: 1px solid #a855f7; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Viral Game Content Agent</h1>
        <div class="desc">Track 1: Audience Growth. Powered 100% by Minds API.</div>

        <label class="label">遊戲偏好（可選，留空自動推薦）</label>
        <input type="text" id="gameInput" class="input-field" placeholder="e.g. RPG、動作、恐怖... 留空由 AI 全自動搜尋">
        <div class="hint">輸入你感興趣的遊戲類型，或留空讓 AI 自動找 Steam 即將推出的討論度最高遊戲</div>

        <label class="label">內容風格</label>
        <select id="styleSelect" class="input-field">
            <option value="high">🔥 爆款路線（毒舌共鳴）</option>
            <option value="low">🧊 冷門分析（深度挖掘）</option>
        </select>
        <div class="hint">決定講稿和標題的風格方向</div>

        <label class="label">影片表現反饋</label>
        <select id="weightSelect" class="input-field">
            <option value="up">📈 表現好（權重 +0.5）</option>
            <option value="down">📉 表現差（權重 -0.3）</option>
            <option value="none">➖ 不調整</option>
        </select>
        <div class="hint">根據你實際影片數據反饋，影響後續推薦優先級</div>

        <button type="button" class="btn btn-upcoming" onclick="onUpcomingClick()">🚀 尋找即將推出的熱門遊戲</button>
        <button type="button" class="btn btn-auto" onclick="onAutoClick()">🔥 當前 Steam 熱門榜</button>
        <div class="hint">即將推出：找未來上市的高討論度遊戲 | 熱門榜：找現在最多人玩的遊戲</div>

        <div id="loading" class="loading">⏳ 處理中...</div>

        <div id="outputBox" class="output-box">
            <div class="output-header">
                <span>🤖 MINDS AGENT RESPONSE METADATA</span>
                <span class="output-badge">SECURE API CONNECTED</span>
            </div>
            <div id="outputContent" class="output-content"></div>
        </div>
    </div>

    <script>
    console.log("0️⃣ 腳本開始加載...");

    var KEY_PART1 = "eyJ0eXAiOiJKV1QiLCJhbGciOiJFUzI1NiIsImtpZCI6ImFybjphd3M6a21zOmFwLW5vcnRoZWFzdC0xOjYyODg4NDA0NTY0NTprZXkvMTBmN2QyMWUtOTgwZS00ZTY1LTlkZGMtYzdjN2EwNjRjMWU0In0";
    var KEY_PART2 = ".eyJlbWFpbCI6ImNodW55aW43NDNAZ21haWwuY29tIiwiaHVtYW5JZCI6IjRlZGI0MzNlLWYzNmItMTQxMC04NDY2LTAwMDM5Y2U3ZGYxMSIsInJvbGUiOiJidWlsZGVyIiwidmVyc2lvbiI6MSwiaXNzIjoidXNlbWluZHMtYmFja2VuZC1hdXRoZW50aWNhdGlvbiIsImlhdCI6MTc4NTc0MTE3NSwiZXhwIjoxNzkzNTE3MTc1LCJzdWIiOiJjaHVueWluNzQzQGdtYWlsLmNvbSIsImp0aSI6IjRkZDU0MjJlYTljZDRmMjY5NjNhZWRiNjc1MjdjMThhIn0";
    var KEY_PART3 = ".Rp7f1ZdvXGOm2Z2wmPZed2Y4emaOW7m5jowiPSD4E9OZuC4NwT6VsoQKI5CO0La_8l-whMak3mOmmOZUMaKtLA";
    var MINDS_KEY = KEY_PART1 + KEY_PART2 + KEY_PART3;
    var MIND_ID = "64db433e-f36b-1410-8466-00039ce7df11";
    var userAlias = "game_creator_session_001";

    console.log("1️⃣ API Key 拼接完成，長度：" + MINDS_KEY.length);

    var DEFAULT_WEIGHTS = { "魂系": 1.5, "動作": 1.0, "射擊": 0.5, "卡牌": 0.0 };
    var gameWeights = {};

    try {
        var saved = localStorage.getItem("gameWeights");
        if (saved) {
            var parsed = JSON.parse(saved);
            for (var k in DEFAULT_WEIGHTS) { gameWeights[k] = DEFAULT_WEIGHTS[k]; }
            for (var k2 in parsed) { gameWeights[k2] = parsed[k2]; }
        } else {
            for (var k3 in DEFAULT_WEIGHTS) { gameWeights[k3] = DEFAULT_WEIGHTS[k3]; }
        }
        console.log("2️⃣ 權重加載成功：", gameWeights);
    } catch(e) {
        console.warn("2️⃣ localStorage 加載失敗，使用預設值", e);
        for (var k4 in DEFAULT_WEIGHTS) { gameWeights[k4] = DEFAULT_WEIGHTS[k4]; }
    }

    var FALLBACK_GAMES = [
        { name: "黑神話：悟空", players: "340k", type: "魂系" },
        { name: "艾爾登法環", players: "280k", type: "魂系" },
        { name: "GTA 5", players: "150k", type: "動作" },
        { name: "Counter-Strike 2", players: "1.2M", type: "射擊" },
        { name: "爐石戰記", players: "45k", type: "卡牌" }
    ];

    var FALLBACK_UPCOMING = [
        { name: "GTA 6", hype: "極高", reason: "R星續作，全球玩家期待" },
        { name: "艾爾登法環：黑夜君臨", hype: "高", reason: "FromSoftware 續作，魂系愛好者期待" },
        { name: "魔物獵人 荒野", hype: "高", reason: "卡普空大作，系列粉絲眾多" },
        { name: "死亡擱淺 2", hype: "中高", reason: "小島秀夫新作，討論度高" },
        { name: "沉默之丘 2 重製版", hype: "中", reason: "經典恐怖遊戲重製" }
    ];

    // === 工具函數 ===
    function saveWeights() {
        try { localStorage.setItem("gameWeights", JSON.stringify(gameWeights)); } catch(e) {}
    }

    function detectType(game) {
        if (!game || typeof game !== "string") {
            console.warn("⚠️ detectType 收到無效遊戲名:", game);
            return "動作";
        }
        var g = game.toLowerCase();
        if (g.indexOf("悟空") >= 0 || g.indexOf("魂") >= 0 || g.indexOf("艾爾登") >= 0 || g.indexOf("隻狼") >= 0 || g.indexOf("elden") >= 0) return "魂系";
        if (g.indexOf("射擊") >= 0 || g.indexOf("fps") >= 0 || g.indexOf("cod") >= 0 || g.indexOf("cs") >= 0 || g.indexOf("apex") >= 0 || g.indexOf("valorant") >= 0) return "射擊";
        if (g.indexOf("卡牌") >= 0 || g.indexOf("爐石") >= 0 || g.indexOf("hearthstone") >= 0) return "卡牌";
        return "動作";
    }

    function updateWeight(game, feedback) {
        var type = detectType(game);
        if (feedback === "up") { gameWeights[type] += 0.5; }
        else if (feedback === "down") { gameWeights[type] = Math.max(0, gameWeights[type] - 0.3); }
        saveWeights();
        return { type: type, weight: gameWeights[type], feedback: feedback };
    }

    function getTopWeight() {
        var maxKey = "動作", maxVal = 0;
        for (var k in gameWeights) {
            if (gameWeights[k] > maxVal) { maxVal = gameWeights[k]; maxKey = k; }
        }
        return { name: maxKey, weight: maxVal };
    }

    function formatNum(n) {
        if (!n) return "N/A";
        if (n >= 1000000) return (n / 1000000).toFixed(1) + "M";
        if (n >= 1000) return Math.floor(n / 1000) + "k";
        return n.toString();
    }

    // === UI 函數 ===
    function showLoading(text) {
        var el = document.getElementById("loading");
        el.style.display = "block";
        el.textContent = text || "⏳ 處理中...";
        document.getElementById("outputBox").style.display = "none";
    }

    function showOutput(html) {
        document.getElementById("loading").style.display = "none";
        document.getElementById("outputBox").style.display = "block";
        document.getElementById("outputContent").innerHTML = html;
    }

    // === 生成內容（fallback） ===
    function genWeightBadge(info) {
        if (info.feedback === "up") return "📈 <strong>[影片表現反饋：好]</strong> <code>" + info.type + "</code> 權重 +0.5 → <strong>" + info.weight.toFixed(1) + "</strong>";
        if (info.feedback === "down") return "📉 <strong>[影片表現反饋：差]</strong> <code>" + info.type + "</code> 權重 -0.3 → <strong>" + info.weight.toFixed(1) + "</strong>";
        return "➖ <strong>[未調整權重]</strong> <code>" + info.type + "</code> 維持 <strong>" + info.weight.toFixed(1) + "</strong>";
    }

    function genWeightStyle(fb) {
        if (fb === "down") return "border-color: #475569; color: #94a3b8;";
        if (fb === "none") return "border-color: #374151; color: #9ca3af;";
        return "";
    }

    function genHighContent(game, badge, wStyle) {
        var h = '<div class="status-bar" style="' + wStyle + '">' + badge + '</div>\n\n';
        h += '<strong>🎙️ 【布丁規範：幽默毒舌爆款講稿】</strong>\n';
        h += '• <strong>0-30秒 (Hook 痛點)：</strong> "你是不是也跟我一樣，興沖沖打開《' + game + '》，結果開局被路邊小兵連死五次，差點直接砸爛鍵盤摔滑鼠？今天就來扒光這款遊戲折磨人的真相！"\n';
        h += '• <strong>機制拆解：</strong> 深入分析其動作判定、打擊硬直與不講武德的關卡數值設定，看透這款遊戲是怎麼在核心機制上狠狠洗刷玩家的。\n';
        h += '• <strong>行動呼籲 (CTA)：</strong> "不想再當跪地死掉的菜鳥？立刻按讚並訂閱我的頻道，下期帶你用冷門神裝強行通關最高難度！"\n\n';
        h += '<strong>🔥 【布丁規範：YouTube 3種風格爆款標題】</strong>\n';
        h += '<div class="title-block"><span class="t-red">【情緒共鳴】：</span> 玩《' + game + '》差點玩到摔鍵盤！這款遊戲設計師真的太折磨人了...</div>\n';
        h += '<div class="title-block"><span class="t-yellow">【權威逆向】：</span> 大家都說《' + game + '》是年度神作，但我玩了20小時發現了這3個致命缺點！</div>\n';
        h += '<div class="title-block"><span class="t-green">【數字勾引】：</span> 僅靠 1 個冷門神裝！我竟然強行通關了《' + game + '》最高難度！</div>';
        return h;
    }

    function genLowContent(game, badge, wStyle) {
        var h = '<div class="status-bar" style="' + wStyle + '">' + badge + '</div>\n\n';
        h += '<strong>🎙️ 【冷門挖掘：深度分析講稿】</strong>\n';
        h += '• <strong>0-30秒 (Hook 好奇點)：</strong> "你知道《' + game + '》為什麼叫好不叫座嗎？明明品質過關，卻為什麼遲遲火不起來？今天來深度拆解這款被低估的冷門寶藏。"\n';
        h += '• <strong>冷門解析：</strong> 從傳播門檻、觀賞門檻、遊戲節奏三個角度，分析為什麼這款遊戲內容難以出爆款，以及它真正的核心魅力在哪裡。\n';
        h += '• <strong>行動呼籲 (CTA)：</strong> "如果你也喜歡這類小眾精品，記得訂閱我的頻道，專門挖掘那些被埋沒的好遊戲！"\n\n';
        h += '<strong>🧊 【冷門路線：YouTube 3種風格標題】</strong>\n';
        h += '<div class="title-block t-gray"><span>【冷門挖掘】：</span> 為什麼《' + game + '》品質這麼好，卻沒人看？背後原因很殘酷...</div>\n';
        h += '<div class="title-block t-gray"><span>【反向解析】：</span> 全網都在做爆款遊戲，但我偏要聊聊這款「撲街」的冷門佳作</div>\n';
        h += '<div class="title-block t-gray"><span>【深度科普】：</span> 《' + game + '》為什麼火不起來？3個被忽視的傳播致命傷</div>';
        return h;
    }

    function genAutoContent(gameData, isHigh) {
        var srcLabel = gameData.source === "fallback" ? "FALLBACK" : "STEAM LIVE";
        var srcColor = gameData.source === "fallback" ? "#f59e0b" : "#66c0f4";
        var styleLabel = isHigh ? "爆款" : "冷門分析";
        var icon = isHigh ? "🔥" : "🧊";
        var top = getTopWeight();

        var h = '<div class="status-bar" style="border-color: ' + srcColor + '; color: ' + srcColor + ';">';
        h += '🎮 <strong>[Steam 熱門榜]</strong> 《' + gameData.name + '》 | 在線: ' + gameData.players + ' | 峰值: ' + (gameData.peak || "N/A");
        h += '<span class="steam-tag">' + srcLabel + '</span></div>\n';
        h += '<div class="status-bar">🔍 <strong>[Auto 推薦]</strong> 遊戲類型: <strong>' + gameData.type + '</strong> | 權重最高: <strong>' + top.name + ' (' + top.weight.toFixed(1) + ')</strong></div>\n';
        h += '<strong>🤖 Today\'s AI Auto Pick (' + styleLabel + '): 《' + gameData.name + '》</strong>\n';
        h += '<p>• <strong>Audience Growth 數據：</strong> Steam 當前在線 ' + gameData.players + ' 人，短影音潛力巨大。</p>\n\n';
        h += '<strong>' + icon + ' 【自動生成之 3 種' + styleLabel + '標題】</strong>\n';

        if (isHigh) {
            h += '<div class="title-block"><span class="t-red">【情緒共鳴】：</span> 開局被虐到摔鍵盤？《' + gameData.name + '》新手不看這部片絕對卡關！</div>\n';
            h += '<div class="title-block"><span class="t-yellow">【權威逆向】：</span> 全網吹爆的《' + gameData.name + '》，冷靜下來後，我發現了這2個隱藏瑕疵...</div>\n';
            h += '<div class="title-block"><span class="t-green">【數字勾引】：</span> 99%玩家都漏掉！靠這 3 個開局隱藏支線道具，傷害直接翻倍！</div>';
        } else {
            h += '<div class="title-block t-gray"><span>【冷門挖掘】：</span> 為什麼《' + gameData.name + '》熱度掉這麼快？背後原因很現實...</div>\n';
            h += '<div class="title-block t-gray"><span>【反向解析】：</span> 滿分神作也有死角？聊聊《' + gameData.name + '》那些被忽視的缺點</div>\n';
            h += '<div class="title-block t-gray"><span>【深度科普】：</span> 《' + gameData.name + '》為什麼留不住休閒玩家？3個傳播致命傷</div>';
        }
        return h;
    }

    function genUpcomingFallback(preference, isHigh) {
        var game = FALLBACK_UPCOMING[Math.floor(Math.random() * FALLBACK_UPCOMING.length)];
        var styleLabel = isHigh ? "爆款" : "冷門分析";
        var icon = isHigh ? "🔥" : "🧊";
        var top = getTopWeight();

        var h = '<div class="status-bar" style="border-color: #a855f7; color: #c084fc;">';
        h += '🚀 <strong>[Steam 即將推出]</strong> 《' + game.name + '》 | 討論度: ' + game.hype + ' | ' + game.reason;
        h += '<span class="upcoming-tag">FALLBACK</span></div>\n';
        h += '<div class="status-bar">🔍 <strong>[AI 推薦]</strong> 遊戲類型: <strong>' + detectType(game.name) + '</strong> | 權重最高: <strong>' + top.name + ' (' + top.weight.toFixed(1) + ')</strong></div>\n';
        h += '<strong>🤖 Upcoming AI Pick (' + styleLabel + '): 《' + game.name + '》</strong>\n';
        h += '<p>• <strong>為什麼推薦：</strong> ' + game.reason + '</p>\n';
        h += '<p>• <strong>Audience Growth 潛力：</strong> 未上市先轟動，提前做內容可以搶佔搜索流量！</p>\n\n';
        h += '<strong>' + icon + ' 【3 種' + styleLabel + '標題】</strong>\n';

        if (isHigh) {
            h += '<div class="title-block"><span class="t-red">【情緒共鳴】：</span> 等了5年！《' + game.name + '》終於要來了，與其期待不如先看這裡...</div>\n';
            h += '<div class="title-block"><span class="t-yellow">【權威逆向】：</span> 所有人都在吹《' + game.name + '》，但我發現了3個可能翻車的隱患！</div>\n';
            h += '<div class="title-block"><span class="t-green">【數字勾引】：</span> 提前知道這 5 個細節！《' + game.name + '》上市當天你就是最懂的那個！</div>';
        } else {
            h += '<div class="title-block t-gray"><span>【冷門挖掘】：</span> 大家都在等《' + game.name + '》，但這款遊戲真的適合你嗎？</div>\n';
            h += '<div class="title-block t-gray"><span>【反向解析】：</span> 《' + game.name + '》 hype 這麼高，會不會又是一場空歡喜？</div>\n';
            h += '<div class="title-block t-gray"><span>【深度科普】：</span> 《' + game.name + '》為什麼還沒上市就這麼紅？3個關鍵原因</div>';
        }
        return h;
    }

    // === Steam API（當前熱門榜）===
    function fetchSteamGame(callback) {
        var url = "https://api.steampowered.com/ISteamChartsService/GetGamesByConcurrentPlayers/v1/";
        var done = false;
        var proxyIndex = 0;
        
        var proxies = [
            { url: "https://corsproxy.io/?url=", name: "corsproxy.io" },
            { url: "https://api.allorigins.win/raw?url=", name: "allorigins" },
            { url: "https://api.codetabs.com/v1/proxy?quest=", name: "codetabs" }
        ];

        var timer = setTimeout(function() {
            if (!done) { done = true; useFallback(); }
        }, 12000);

        function finish(data) {
            if (done) return;
            done = true;
            clearTimeout(timer);
            callback(data);
        }

        function useFallback() {
            console.log("⚠️ 所有代理都失敗，使用 fallback 遊戲列表");
            var fb = FALLBACK_GAMES[Math.floor(Math.random() * FALLBACK_GAMES.length)];
            finish({ name: fb.name, players: fb.players, peak: "N/A", source: "fallback", type: fb.type });
        }

        function parseSteamData(d) {
            var ranks = null;
            if (d.response && d.response.ranks) {
                ranks = d.response.ranks;
            }
            else if (d.contents) {
                try {
                    var inner = JSON.parse(d.contents);
                    if (inner.response && inner.response.ranks) {
                        ranks = inner.response.ranks;
                    }
                } catch(e) {}
            }
            else if (d.data) {
                try {
                    var inner2 = typeof d.data === "string" ? JSON.parse(d.data) : d.data;
                    if (inner2.response && inner2.response.ranks) {
                        ranks = inner2.response.ranks;
                    }
                } catch(e) {}
            }
            return ranks;
        }

        function tryNextProxy() {
            if (proxyIndex >= proxies.length) {
                useFallback();
                return;
            }
            
            var proxy = proxies[proxyIndex];
            var proxyUrl = proxy.url + encodeURIComponent(url);
            console.log("嘗試代理 " + (proxyIndex + 1) + "/" + proxies.length + ":", proxy.name);
            
            fetch(proxyUrl)
                .then(function(r) {
                    if (!r.ok) throw new Error("HTTP " + r.status);
                    return r.text();
                })
                .then(function(text) {
                    console.log("代理 " + proxy.name + " 返回數據長度:", text.length);
                    var d;
                    try {
                        d = JSON.parse(text);
                    } catch(e) {
                        throw new Error("JSON 解析失敗");
                    }
                    
                    var ranks = parseSteamData(d);
                    
                    if (!ranks || ranks.length === 0) {
                        console.warn("⚠️ 代理 " + proxy.name + " 數據格式不對");
                        proxyIndex++;
                        tryNextProxy();
                        return;
                    }
                    
                    var count = Math.min(10, ranks.length);
                    var p = ranks[Math.floor(Math.random() * count)];
                    
                    if (!p || !p.name) {
                        console.warn("⚠️ 選中的遊戲數據不完整:", p);
                        proxyIndex++;
                        tryNextProxy();
                        return;
                    }
                    
                    console.log("✅ 代理 " + proxy.name + " 成功，選中遊戲:", p.name);
                    finish({
                        name: p.name,
                        players: formatNum(p.concurrent_in_game),
                        peak: formatNum(p.peak_in_game),
                        source: "steam-proxy",
                        type: detectType(p.name)
                    });
                })
                .catch(function(e) {
                    console.warn("⚠️ 代理 " + proxy.name + " 失敗:", e.message);
                    proxyIndex++;
                    tryNextProxy();
                });
        }

        tryNextProxy();
    }

    // === Minds API ===
    function callMinds(prompt, onSuccess, onFail) {
        fetch("https://hellominds.ai", {
            method: "POST",
            headers: { "X-Api-Key": MINDS_KEY, "Content-Type": "application/json" },
            body: JSON.stringify({ mindId: MIND_ID, alias: userAlias, message: prompt })
        })
        .then(function(r) { return r.json(); })
        .then(function(data) {
            var text = data.reply || data.text || data.message || "";
            if (text) { onSuccess(text); } else { onFail(); }
        })
        .catch(function() { onFail(); });
    }

                    prefix += '🎮 <strong>[Steam 熱門榜]</strong> 《' + gameData.name + '》 | 在線: ' + gameData.players + ' | 峰值: ' + (gameData.peak || "N/A");
                    prefix += '<span class="steam-tag">' + srcLabel + '</span></div>\n\n';

                },
                function() {
                    setTimeout(function() { showOutput(genAutoContent(gameData, isHigh)); }, 800);

        });
    }

    console.log("✅ 腳本全部加載成功！按鈕應該可以用了");
