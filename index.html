<html lang="zh-TW">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Viral Game Content Agent</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #030712;
            color: #f3f4f6;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            margin: 0;
            padding: 24px 16px;
            box-sizing: border-box;
        }
        .container {
            max-width: 1200px;
            width: 100%;
        }
        h1 {
            text-align: center;
            font-size: 22px;
            margin-top:0;
            margin-bottom:24px;
        }
        .two-col {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap:20px;
        }
        .panel {
            background:#111827;
            border-radius:12px;
            padding:18px;
            border:1px solid #1f2937;
        }
        button {
            background:#2563eb;
            color:white;
            border:none;
            padding:10px 14px;
            border-radius:8px;
            cursor:pointer;
            font-size:14px;
            margin:4px;
        }
        button:hover {
            background:#1d4ed8;
        }
        button.secondary {
            background:#374151;
        }
        button.secondary:hover {
            background:#4b5563;
        }
        textarea {
            width:100%;
            box-sizing:border-box;
            background:#1f2937;
            color:#f3f4f6;
            border:1px solid #374151;
            border-radius:8px;
            padding:10px;
            min-height:100px;
        }
        .output-box {
            background:#0b1120;
            border-radius:8px;
            padding:14px;
            min-height:320px;
            white-space:pre-wrap;
            overflow:auto;
            border:1px solid #1f2937;
        }
        .log-area {
            font-size:12px;
            color:#9ca3af;
            margin-top:12px;
            max-height:180px;
            overflow:auto;
        }
        .chat-input-row {
            display:flex;
            gap:8px;
            margin-top:12px;
        }
        .chat-input-row textarea {
            flex:1;
            min-height:60px;
        }
        @media(max-width:768px){
            .two-col{
                grid-template-columns:1fr;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <h1>Viral Game Content Agent</h1>
    <div class="two-col">
        <div class="panel">
            <h3>🎮 功能按鈕</h3>
            <div>
                <button id="btnHot">🔥 Steam當前熱門榜</button>
                <button id="btnUpcoming">📅 即將推出熱門遊戲</button>
                <button id="btnLowPopGoodReview">⭐ 在線人數少但高評價單機</button>
            </div>
            <div style="margin-top:8px;">
                <button id="btnTriggerAuto" class="secondary">▶️ Run now 手動觸發自主生成</button>
            </div>
            <div style="margin-top:16px;">
                <h4>💬 對話歷史｜持續討論企劃</h4>
                <div class="chat-input-row">
                    <textarea id="chatInput" placeholder="繼續對AI調整企劃..."></textarea>
                    <button id="btnSendChat">發送</button>
                </div>
            </div>

            <div class="log-area" id="logBox"></div>
        </div>

        <div class="panel">
            <h3>📄 AI輸出結果</h3>
            <div class="output-box" id="resultBox"></div>
        </div>
    </div>
</div>

<script>
// ====================== 配置區 ======================
// ✅ PROXY_BASE 結尾絕對不能帶斜線
const PROXY_BASE = "https://winter-disk-958a.chunyin743.workers.dev";

let currentAlias = null;
let pollTimer = null;
let autoCheckTimer = null;

const logBox = document.getElementById("logBox");
const resultBox = document.getElementById("resultBox");

function log(msg){
    const t = new Date().toLocaleTimeString();
    logBox.innerText += `[${t}] ${msg}\n`;
    logBox.scrollTop = logBox.scrollHeight;
    console.log(msg);
}

// 頁載入
log("0️⃣ 腳本開始加載...");
log(`1️⃣ 代理狀態：已配置 ✅ ${PROXY_BASE}`);

// 輪詢自動計劃，每10秒
async function checkAutoPlan(){
    try{
        const res = await fetch(PROXY_BASE + "/get-auto",{
            method:"GET",
            headers:{"Content-Type":"application/json"}
        });
        if(!res.ok) throw new Error("http "+res.status);
        const json = await res.json();
        if(json.pending){
            log("🤖 偵測到待執行自動任務");
        }
    }catch(e){
        log("checkAutoPlan 錯誤:"+e.message);
    }
}

autoCheckTimer = setInterval(checkAutoPlan,10000);

// 呼叫minds send
async function callMindsSend(prompt){
    log("🤖 發送消息到 Minds...");
    log(`📝 Prompt片段: ${prompt.substring(0,120)}...`);

    const payload = {
        alias: currentAlias,
        message: prompt
    };

    const resp = await fetch(PROXY_BASE + "/minds/send",{
        method:"POST",
        headers:{
            "Content-Type":"application/json"
        },
        body:JSON.stringify(payload)
    });
    if(!resp.ok){
        const errText = await resp.text();
        throw new Error(`send fail ${resp.status} ${errText}`);
    }
    const j = await resp.json();
    currentAlias = j.alias;
    log(`✅ message已送出 alias=${currentAlias}`);
    return j;
}

// 輪詢讀取reply
async function pollReply(alias, maxWaitMs=300000){
    const start = Date.now();
    while(Date.now() - start < maxWaitMs){
        await new Promise(r=>setTimeout(r,1800));
        const res = await fetch(PROXY_BASE+"/minds/reply",{
            method:"POST",
            headers:{"Content-Type":"application/json"},
            body:JSON.stringify({alias:alias})
        });
        if(!res.ok) continue;
        const arr = await res.json();
        if(!Array.isArray(arr)) continue;
        //取最後一條ai回覆
        const aiMsg = arr.filter(x=>x.senderType===2).pop();
        if(aiMsg && aiMsg.content){
            return aiMsg.content;
        }
    }
    throw new Error("輪詢等待超時");
}

// 按鈕：Steam熱門榜
document.getElementById("btnHot").onclick = async ()=>{
    try{
        log("🎯 熱門榜按鈕被點擊");
        resultBox.innerText = "生成中...";
        const prompt = `你是一個遊戲內容創作助手。請搜尋並列出目前 Steam 平台上在線人數最高的熱門遊戲（前5名），包括遊戲名稱、大約在線人數、遊戲類型。
然後，從中挑選1款最適合做高觀看率爆款影片的遊戲，生成完整短影片企劃，包含30秒開場Hook講稿、影片結構、標題選項。
不要輸出無關系統訊息，只輸出遊戲企劃內容。`;
        await callMindsSend(prompt);
        const out = await pollReply(currentAlias);
        resultBox.innerHTML = out;
    }catch(e){
        resultBox.innerText = "錯誤："+e.message;
        log("錯誤:"+e.message);
    }
};

//按鈕：即將推出
document.getElementById("btnUpcoming").onclick = async ()=>{
    try{
        log("🎯 即將推出按鈕被點擊");
        resultBox.innerText = "生成中...";
        const prompt = `你是遊戲內容創作助手。列出Steam即將發售備受關注遊戲Top5，包含遊戲名稱、預計發售日、類型。
挑選一款適合做爆款短影片，輸出完整企劃，30秒Hook講稿、影片結構、多組標題。
不要輸出無關系統訊息，只輸出遊戲企劃內容。`;
        await callMindsSend(prompt);
        const out = await pollReply(currentAlias);
        resultBox.innerHTML = out;
    }catch(e){
        resultBox.innerText = "錯誤："+e.message;
        log("錯誤:"+e.message);
    }
};

//按鈕：在線人數少高評價單機
document.getElementById("btnLowPopGoodReview").onclick = async ()=>{
    try{
        log("🎯 小眾高評單機按鈕被點擊");
        resultBox.innerText = "生成中...";
        const prompt = `你是遊戲內容創作助手。搜尋Steam平台：在線人數較少，但玩家好評率很高的單機遊戲，列出前5款，遊戲名稱、大約同時在線、好評率、遊戲類型。
從裡面挑選一款適合做爆款短影片，生成完整企劃：30秒開場Hook講稿、影片段落結構、多個吸引人標題。
不要輸出無關系統訊息，只輸出遊戲企劃內容。`;
        await callMindsSend(prompt);
        const out = await pollReply(currentAlias);
        resultBox.innerHTML = out;
    }catch(e){
        resultBox.innerText = "錯誤："+e.message;
        log("錯誤:"+e.message);
    }
};

//手動觸發auto
document.getElementById("btnTriggerAuto").onclick = async ()=>{
    try{
        log("▶️ 手動觸發自動生成");
        const res = await fetch(PROXY_BASE+"/trigger-auto",{
            method:"POST",
            headers:{"Content-Type":"application/json"}
        });
        const j = await res.json();
        log("trigger-auto返回 "+JSON.stringify(j));
        alert("已觸發自動任務");
    }catch(err){
        log("trigger-auto錯誤:"+err.message);
        alert("觸發失敗 "+err.message);
    }
};

//聊天發送
document.getElementById("btnSendChat").onclick = async ()=>{
    const inputDom = document.getElementById("chatInput");
    const text = inputDom.value.trim();
    if(!text) return;
    try{
        log("💬 發送繼續對話："+text);
        inputDom.value = "";
        await callMindsSend(text);
        const out = await pollReply(currentAlias);
        resultBox.innerHTML = out;
    }catch(e){
        log("聊天錯誤："+e.message);
    }
};

log("✅ 腳本加載完成");
</script>
</body>
</html>
