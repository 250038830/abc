<html lang="zh-TW">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Viral Game Content Agent</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #030712;
            color: #f3f4f6;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            margin: 0;
            padding: 24px 16px;
            box-sizing: border-box;
        }
        .container {
            max-width: 1200px;
            width: 100%;
            background-color: #111827;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 10px 30px #00000080;
        }
        .two-column {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap:20px;
        }
        @media(max-width:820px){
            .two-column{
                grid-template-columns:1fr;
            }
        }
        .btn-group{
            display:flex;
            gap:12px;
            flex-wrap:wrap;
            margin-bottom:20px;
        }
        button{
            background:#2563eb;
            color:white;
            border:none;
            padding:10px 16px;
            border-radius:8px;
            cursor:pointer;
            font-size:14px;
        }
        button:disabled{
            background:#374151;
            cursor:not-allowed;
        }
        .output-box{
            background:#1f2937;
            padding:16px;
            border-radius:8px;
            min-height:320px;
            overflow:auto;
        }
        .log-area{
            font-family:monospace;
            font-size:12px;
            color:#9ca3af;
            white-space:pre-wrap;
            max-height:220px;
            overflow:auto;
            margin-bottom:12px;
        }
        textarea{
            width:100%;
            box-sizing:border-box;
            background:#1f2937;
            color:#f3f4f6;
            border:1px solid #374151;
            border-radius:8px;
            padding:10px;
            min-height:90px;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>Viral Game Content Agent</h1>
    <div class="log-area" id="consoleLog"></div>

    <div class="btn-group">
        <button id="btnHot">🔥 Steam當前熱門榜</button>
        <button id="btnUpcoming">📅 即將推出熱門遊戲</button>
        <button id="btnLowPopGoodReview">⭐ 在線人數少但好評高單機遊戲</button>
    </div>

    <div class="two-column">
        <div>
            <h3>📝 AI生成企劃</h3>
            <div class="output-box" id="aiOutput"></div>
        </div>
        <div>
            <h3>💬 對話繼續討論企劃</h3>
            <textarea id="chatInput" placeholder="輸入訊息繼續與AI討論企劃..."></textarea>
            <div style="margin-top:8px;">
                <button id="btnSendChat">發送對話</button>
            </div>
            <div class="output-box" id="chatBox" style="margin-top:10px;max-height:340px;overflow:auto;"></div>
        </div>
    </div>

</div>

<script>
const WORKER_BASE = "https://winter-disk-958a.chunyin743.workers.dev";
const MIND_ID = "64db433e-f36b-1410-8466-00039ce7df11";
const ALIAS = "webapp:thread-1786952803988-6ka4jx";
const POLL_INTERVAL = 2200;
const MAX_POLL = 130;

const $ = s=>document.querySelector(s);
const logEl = $("#consoleLog");
const aiOutputEl = $("#aiOutput");
const chatBoxEl = $("#chatBox");

function log(msg){
    const t = new Date().toLocaleTimeString();
    logEl.innerText += `[${t}] ${msg}\n`;
    logEl.scrollTop = logEl.scrollHeight;
}

async function callMinds(prompt,alias){
    log("🤖 透過 Worker 調用 Minds API...");
    const resp = await fetch(`${WORKER_BASE}/minds/send`,{
        method:"POST",
        headers:{
            "Content-Type":"application/json"
        },
        body:JSON.stringify({
            alias: alias,
            messageText: prompt
        })
    });
    const json = await resp.json();
    log(`📡 send status: ${resp.status}`);
    return json;
}

async function fetchHistory(alias){
    const resp = await fetch(`${WORKER_BASE}/minds/history?alias=${encodeURIComponent(alias)}`);
    return await resp.json();
}

async function pollReply(alias,beforeMsgCount){
    for(let i=0;i<MAX_POLL;i++){
        const hist = await fetchHistory(alias);
        if(!Array.isArray(hist)){
            log("⚠️ history返回非陣列");
            await sleep(POLL_INTERVAL);
            continue;
        }
        const aiItems = hist.filter(x=>x.senderType===2);
        if(aiItems.length > beforeMsgCount){
            const newItem = aiItems[aiItems.length-1];
            return newItem.content;
        }
        log(`⏳輪詢等待回覆 ${i+1}/${MAX_POLL}`);
        await sleep(POLL_INTERVAL);
    }
    throw new Error("輪詢超時，沒有取得AI回覆");
}

function sleep(ms){
    return new Promise(r=>setTimeout(r,ms));
}

async function runPrompt(prompt){
    try{
        aiOutputEl.innerHTML = "<em>等待AI回覆...</em>";
        log("🎯執行prompt");
        log(`📝Prompt片段：${prompt.substring(0,120)}...`);

        const preHist = await fetchHistory(ALIAS);
        const preCount = Array.isArray(preHist) ? preHist.filter(x=>x.senderType===2).length : 0;

        await callMinds(prompt,ALIAS);
        const replyHtml = await pollReply(ALIAS,preCount);
        aiOutputEl.innerHTML = replyHtml;
        log("✅取得AI企劃完成");
    }catch(err){
        log(`❌錯誤:${err.message}`);
        aiOutputEl.innerHTML = `<span style="color:#f87171">執行失敗：${err.message}</span>`;
    }
}

$("#btnHot").onclick = async ()=>{
    const prompt = `你是一個遊戲內容創作助手。請搜尋並列出目前 Steam 平台上在線人數最高的熱門遊戲（前5名），包括遊戲名稱、大約在線人數、遊戲類型。
然後，從中挑選1款最適合做高觀看率爆款影片的遊戲，生成完整短影片企劃，包含30秒開場Hook講稿、內容架構、賣點分析。
不要輸出無關系統資訊，只輸出企劃內容，使用繁體中文。`;
    await runPrompt(prompt);
};

$("#btnUpcoming").onclick = async ()=>{
    const prompt = `你是遊戲內容創作助手。列出Steam即將發售人氣最高5款遊戲，名稱、預計發售時間、類型。挑選一款適合做爆款短影片，產出完整影片企劃、30秒Hook講稿。繁體中文，不要輸出無關資訊。`;
    await runPrompt(prompt);
};

$("#btnLowPopGoodReview").onclick = async ()=>{
    const prompt = `你是遊戲內容創作助手。尋找Steam平台在線人數較少但是玩家好評率很高的單機遊戲，列出前五款，名稱、好評率、遊戲類型。挑選一款適合做爆款短影片，生成完整影片企劃、30秒開場Hook講稿，繁體中文，不要輸出無關系統資訊。`;
    await runPrompt(prompt);
};

$("#btnSendChat").onclick = async ()=>{
    const text = $("#chatInput").value.trim();
    if(!text)return;
    chatBoxEl.innerHTML += `<div>👤${escapeHtml(text)}</div>`;
    $("#chatInput").value = "";
    try{
        const preHist = await fetchHistory(ALIAS);
        const preCount = Array.isArray(preHist)?preHist.filter(x=>x.senderType===2).length:0;
        await callMinds(text,ALIAS);
        const replyHtml = await pollReply(ALIAS,preCount);
        chatBoxEl.innerHTML += `<div style="margin-top:8px;">🤖${replyHtml}</div>`;
        chatBoxEl.scrollTop = chatBoxEl.scrollHeight;
    }catch(e){
        chatBoxEl.innerHTML += `<div style="color:#f87171">錯誤:${e.message}</div>`;
    }
};

function escapeHtml(str){
    return str.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

log("0️⃣ 腳本開始加載...");
log(`1️⃣ 代理狀態：已配置 ✅ ${WORKER_BASE}`);
log("✅ 腳本加載完成，代理狀態：已配置 ✅");
</script>
</body>
</html>
