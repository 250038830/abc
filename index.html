        .weight-status { font-size: 12px; color: #38bdf8; background: #111827; padding: 6px 12px; border-radius: 6px; margin-bottom: 14px; border: 1px solid #1e293b; display: inline-block; }

    <script>

        const DEFAULT_WEIGHTS = { "魂系": 1.5, "動作": 1.0, "射擊": 0.5, "卡牌": 0.0 };
        let gameWeights = loadWeights();

        // 🎮 Steam 熱門遊戲 fallback 列表（API 失敗時用）
        const FALLBACK_GAMES = [

            { name: "塞爾達傳說：王國之淚", players: "N/A", type: "動作" },

            { name: "Counter-Strike 2", players: "1.2M", type: "射擊" }
        ];

        function loadWeights() {
            try {
                const saved = localStorage.getItem("gameWeights");
                if (saved) {
                    const parsed = JSON.parse(saved);
                    return { ...DEFAULT_WEIGHTS, ...parsed };
                }
            } catch (e) {
                console.warn("讀取 localStorage 失敗，使用預設值", e);
            }
            return { ...DEFAULT_WEIGHTS };
        }

        function saveWeights() {
            try {
                localStorage.setItem("gameWeights", JSON.stringify(gameWeights));
            } catch (e) {
                console.warn("保存 localStorage 失敗", e);
            }
        }

        function detectGameType(game) {
            const g = game.toLowerCase();
            if (/悟空|魂|艾爾登|隻狼|血源|仁王|黑魂|黑暗靈魂|demon'?s? souls|dark souls|elden ring|sekiro|bloodborne|nioh|black myth|wukong/i.test(g)) return "魂系";
            if (/射擊|fps|tps|cod|決勝時刻|戰地|battlefield|counter.?strike|絕地求生|pubg|apex|valorant|鬥陣特攻|overwatch|虹彩六號|rainbow six|cs2|csgo|槍戰/i.test(g)) return "射擊";
            if (/卡牌|爐石|hearthstone|遊戲王|yu.?gi.?oh|mtg|magic the gathering|自走棋|auto.?chess|撲克|牌組/i.test(g)) return "卡牌";
            return "動作";
        }

        function updateWeight(game, feedback) {
            const type = detectGameType(game);
            let change = 0;
            if (feedback === 'up') {
                gameWeights[type] += 0.5;
                change = 0.5;
            } else if (feedback === 'down') {
                gameWeights[type] = Math.max(0, gameWeights[type] - 0.3);
                change = -0.3;
            }
            saveWeights();
            return { type, weight: gameWeights[type], change, feedback };
        }

        // ✅ 新增：從 Steam 官方 API 拉熱門榜
        async function fetchSteamTopGame() {
            const steamApiUrl = "https://api.steampowered.com/ISteamChartsService/GetGamesByConcurrentPlayers/v1/";
            
            try {
                const response = await fetch(steamApiUrl);
                if (!response.ok) throw new Error("Steam API 請求失敗");
                
                const data = await response.json();
                const ranks = data?.response?.ranks || [];
                
                if (ranks.length === 0) throw new Error("Steam API 返回空數據");
                
                // 取前 10 名中隨機一個，避免永遠只推第一名
                const top10 = ranks.slice(0, 10);
                const picked = top10[Math.floor(Math.random() * top10.length)];
                
                return {
                    name: picked.name,
                    players: formatNumber(picked.concurrent_in_game),
                    peak: formatNumber(picked.peak_in_game),
                    source: "steam",
                    type: detectGameType(picked.name)
                };
            } catch (err) {
                console.warn("Steam API 調用失敗，使用 fallback 列表:", err.message);
                
                // 嘗試用 CORS 代理再試一次
                try {
                    const proxyUrl = "https://api.allorigins.win/raw?url=" + encodeURIComponent(steamApiUrl);
                    const response = await fetch(proxyUrl);
                    if (!response.ok) throw new Error("代理也失敗");
                    
                    const data = await response.json();
                    const ranks = data?.response?.ranks || [];
                    
                    if (ranks.length > 0) {
                        const top10 = ranks.slice(0, 10);
                        const picked = top10[Math.floor(Math.random() * top10.length)];
                        return {
                            name: picked.name,
                            players: formatNumber(picked.concurrent_in_game),
                            peak: formatNumber(picked.peak_in_game),
                            source: "steam-proxy",
                            type: detectGameType(picked.name)
                        };
                    }
                } catch (proxyErr) {
                    console.warn("CORS 代理也失敗:", proxyErr.message);
                }
                
                // 最終 fallback：從預設列表隨機選
                const picked = FALLBACK_GAMES[Math.floor(Math.random() * FALLBACK_GAMES.length)];
                return {
                    name: picked.name,
                    players: picked.players,
                    peak: "N/A",
                    source: "fallback",
                    type: picked.type
                };
            }
        }

        function formatNumber(num) {
            if (!num) return "N/A";
            if (num >= 1000000) return (num / 1000000).toFixed(1) + "M";
            if (num >= 1000) return (num / 1000).toFixed(0) + "k";
            return num.toString();
        }

                        if (isHighStyle) {
