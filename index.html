<head>

    <style>

            display: flex;
            justify-content: center;

            margin: 0;
            padding: 24px 16px;

        .container {
            max-width: 1000px;
            width: 100%;
            background-color: #0b1329;
            border: 1px solid #1e293b;

            padding: 32px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5), 0 0 30px rgba(59, 130, 246, 0.15);

        }
        h1 {
            font-size: 26px;
            font-weight: 800;
            margin-top: 0;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #38bdf8 0%, #818cf8 100%);

            -webkit-text-fill-color: transparent;
            text-align: center;
        }
        .desc {
            font-size: 14px;

        .main-layout {
            display: flex;

        }
        .control-panel {
            width: 320px;
            flex-shrink: 0;
        }
        .output-panel {
            flex: 1;
            min-width: 0;
        }
        @media (max-width: 820px) {
            .main-layout { flex-direction: column; }
            .control-panel { width: 100%; }

        .label {
            display: block;
            font-size: 13px;
            font-weight: 600;

        select.input-field {

            font-size: 14px;

        }
        .btn {

            border: none;
            border-radius: 10px;
            padding: 16px;

        .btn-hint {

            color: rgba(255,255,255,0.7);

        .divider {
            display: flex;
            align-items: center;

        .output-content h1, .output-content h2, .output-content h3 {

        .output-content a { color: #60a5fa; }
        .output-content hr {
            border: none;
            border-top: 1px solid #1e293b;

        }
        .output-content ul, .output-content ol {
            padding-left: 24px;
            line-height: 1.8;
        }
        .output-content li { margin-bottom: 6px; }

        .status-bar {
            font-size: 12px;
            color: #38bdf8;

        .loading {
            color: #eab308;
            font-weight: bold;

        .proxy-ok { background: rgba(16, 185, 129, 0.1); color: #10b981; border: 1px solid rgba(16, 185, 129, 0.3); }
        .proxy-no { background: rgba(239, 68, 68, 0.1); color: #f43f5e; border: 1px solid rgba(239, 68, 68, 0.3); }
        .error-box {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.4);
            border-radius: 10px;
            padding: 20px;
        }
        .error-title { color: #f43f5e; font-weight: bold; font-size: 16px; margin-bottom: 10px; }
        .error-text { color: #fca5a5; font-size: 13px; line-height: 1.6; }
        .error-retry {
            margin-top: 14px;
            background: #ef4444;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
        }
        .error-retry:hover { background: #dc2626; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Viral Game Content Agent</h1>
        <div class="desc">Track 1: Audience Growth. Powered 100% by Minds AI.</div>

        <div class="main-layout">
            <div class="control-panel">
                <div id="proxyStatus" class="proxy-status proxy-no">⚠️ 代理未配置</div>

                <label class="label">搜尋模式</label>
                <select id="styleSelect" class="input-field">
                    <option value="high">🔥 爆款路線（熱門遊戲）</option>
                    <option value="low">🧊 冷門好評單機（在線人數少但好評率高）</option>
                </select>
                <div class="hint">爆款 = 熱門遊戲；冷門 = 在線人數少但好評率高的單機遊戲</div>

                <label class="label">影片表現反饋</label>
                <select id="weightSelect" class="input-field">
                    <option value="up">📈 表現好（權重 +0.5）</option>
                    <option value="down">📉 表現差（權重 -0.3）</option>
                    <option value="none">➖ 不調整</option>
                </select>
                <div class="hint">根據你實際影片數據反饋，影響後續推薦優先級</div>

                <div class="divider"><span>選擇時間範圍</span></div>

                <button type="button" class="btn btn-hot" onclick="onHotClick()">
                    🔥 當前遊戲
                    <div class="btn-hint">搜尋目前正在發售的遊戲</div>
                </button>

                <button type="button" class="btn btn-upcoming" onclick="onUpcomingClick()">
                    🚀 即將推出
                    <div class="btn-hint">搜尋未來 3-6 個月內發售的遊戲</div>
                </button>
            </div>

            <div class="output-panel">
                <div id="loading" class="loading">⏳ 處理中...</div>
                <div id="outputBox" class="output-box">
                    <div class="output-header">
                        <span>🤖 MINDS AI 輸出結果</span>
                        <span class="output-badge">LIVE API</span>
                    </div>
                    <div id="outputContent" class="output-content"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        console.log("0️⃣ 腳本開始加載...");

        var PROXY_BASE = "https://winter-disk-958a.chunyin743.workers.dev";

        var MINDS_KEY = "eyJ0eXAiOiJKV1QiLCJhbGciOiJFUzI1NiIsImtpZCI6ImFybjphd3M6a21zOmFwLW5vcnRoZWFzdC0xOjYyODg4NDA0NTY0NTprZXkvODgwODA0ZjQtNTc4ZC00ZGY3LThkYWQtMmQ5ODg2Y2M5MmZmIn0.eyJlbWFpbCI6ImNodW55aW43NDNAZ21haWwuY29tIiwiaHVtYW5JZCI6IjRlZGI0MzNlLWYzNmItMTQxMC04NDY2LTAwMDM5Y2U3ZGYxMSIsInJvbGUiOiJ1c2VyIiwidmVyc2lvbiI6MywiaXNzIjoidXNlbWluZHMtYmFja2VuZC1hdXRoZW50aWNhdGlvbiIsImlhdCI6MTc4Njk1MjY5MCwiZXhwIjoxNzk0NzI4Njg5LCJzdWIiOiJjaHVueWluNzQzQGdtYWlsLmNvbSJ9.wkdjz9fHp7nZLn0dI3nz-8xtKrF6fWVVwKgv3uwjK6FAgeHy7Oxg8aMDbtl9t_m26iGYz1IKs9ipOELApCTg2g";

        var MIND_ID = "64db433e-f36b-1410-8466-00039ce7df11";

        var HAS_PROXY = PROXY_BASE && PROXY_BASE !== "YOUR_WORKER_URL" && PROXY_BASE.length > 10;
        if (HAS_PROXY) {
            document.getElementById("proxyStatus").className = "proxy-status proxy-ok";
            document.getElementById("proxyStatus").textContent = "✅ 代理已配置：" + PROXY_BASE;
        }
        console.log("1️⃣ 代理狀態：" + (HAS_PROXY ? "已配置 ✅ " + PROXY_BASE : "未配置 ⚠️"));

        // 全局：當前輪詢定時器，用於取消上一個請求
        var currentPollTimer = null;
        var currentRequestId = 0;

        var DEFAULT_WEIGHTS = { "魂系": 1.5, "動作": 1.0, "射擊": 0.5, "卡牌": 0.0 };
        var gameWeights = {};

        try {
            var saved = localStorage.getItem("gameWeights");
            if (saved) {
                var parsed = JSON.parse(saved);
                for (var k in DEFAULT_WEIGHTS) { gameWeights[k] = DEFAULT_WEIGHTS[k]; }
                for (var k2 in parsed) { gameWeights[k2] = parsed[k2]; }
            } else {
                for (var k3 in DEFAULT_WEIGHTS) { gameWeights[k3] = DEFAULT_WEIGHTS[k3]; }
            }
        } catch(e) {
            for (var k4 in DEFAULT_WEIGHTS) { gameWeights[k4] = DEFAULT_WEIGHTS[k4]; }
        }

        function saveWeights() {
            try { localStorage.setItem("gameWeights", JSON.stringify(gameWeights)); } catch(e) {}
        }

        function detectType(game) {
            if (!game || typeof game !== "string") return "動作";
            var g = game.toLowerCase();
            if (g.indexOf("悟空") >= 0 || g.indexOf("魂") >= 0 || g.indexOf("艾爾登") >= 0 || g.indexOf("隻狼") >= 0 || g.indexOf("elden") >= 0 || g.indexOf("black myth") >= 0) return "魂系";
            if (g.indexOf("射擊") >= 0 || g.indexOf("fps") >= 0 || g.indexOf("cod") >= 0 || g.indexOf("cs") >= 0 || g.indexOf("apex") >= 0 || g.indexOf("valorant") >= 0 || g.indexOf("counter-strike") >= 0 || g.indexOf("pubg") >= 0) return "射擊";
            if (g.indexOf("卡牌") >= 0 || g.indexOf("爐石") >= 0 || g.indexOf("hearthstone") >= 0 || g.indexOf("pokemon") >= 0) return "卡牌";
            return "動作";
        }

        function updateWeight(game, feedback) {
            var type = detectType(game);
            if (feedback === "up") { gameWeights[type] += 0.5; }
            else if (feedback === "down") { gameWeights[type] = Math.max(0, gameWeights[type] - 0.3); }
            saveWeights();
            return { type: type, weight: gameWeights[type], feedback: feedback };
        }

        function getTopWeight() {
            var maxKey = "動作", maxVal = 0;
            for (var k in gameWeights) {
                if (gameWeights[k] > maxVal) { maxVal = gameWeights[k]; maxKey = k; }
            }
            return { name: maxKey, weight: maxVal };
        }

        function showLoading(text) {
            var el = document.getElementById("loading");
            el.style.display = "block";
            el.textContent = text || "⏳ 處理中...";
            document.getElementById("outputBox").style.display = "none";
        }

        function showOutput(html) {
            document.getElementById("loading").style.display = "none";
            document.getElementById("outputBox").style.display = "block";
            var container = document.getElementById("outputContent");
            container.innerHTML = html;
            var allElements = container.querySelectorAll("*");
            for (var i = 0; i < allElements.length; i++) {
                allElements[i].style.background = "";
                allElements[i].style.backgroundColor = "";
                allElements[i].style.color = "";
            }
        }

        function showError(errorType, retryFunc, errorDetail) {
            document.getElementById("loading").style.display = "none";
            document.getElementById("outputBox").style.display = "block";

            var errorMsg = "";
            var errorText = "";

            if (errorType === "proxy_not_configured") {
                errorMsg = "代理未配置";
                errorText = "請在代碼中將 PROXY_BASE 設置為你的 Cloudflare Worker URL。";
            } else if (errorType === "network_error") {
                errorMsg = "網絡連接失敗";
                errorText = "無法連接到 Cloudflare Worker 代理。";
            } else if (errorType === "empty_response") {
                errorMsg = "Minds 返回空結果";
                errorText = "Minds API 已響應，但返回內容為空。請稍後重試。";
            } else if (errorType === "timeout") {
                errorMsg = "AI 回覆超時";
                errorText = "Minds AI 生成回覆時間過長（超過 300 秒）。可能是 Minds 端臨時繁忙，請稍後重試。";
            } else if (errorType === "minds_error") {
                errorMsg = "Minds API 調用失敗";
                errorText = "錯誤詳情：<br><code style='background:#111;padding:4px 8px;border-radius:4px;font-size:12px;word-break:break-all;display:inline-block;margin-top:4px;'>" + (errorDetail || "未知錯誤") + "</code>";
            } else {
                errorMsg = "未知錯誤";
                errorText = "發生未知錯誤，請稍後重試。";
            }

            var retryBtnId = "retryBtn_" + Date.now();
            var html = '<div class="error-box">';
            html += '<div class="error-title">❌ ' + errorMsg + '</div>';
            html += '<div class="error-text">' + errorText + '</div>';
            if (retryFunc) {
                html += '<button class="error-retry" id="' + retryBtnId + '" onclick="(' + retryFunc.toString() + ')()">🔄 重新嘗試</button>';
            }
            html += '</div>';
            document.getElementById("outputContent").innerHTML = html;
        }

        // ✅ callMinds：時間戳檢測 + 自動取消上一個輪詢
        function callMinds(prompt, onSuccess, onFail) {
            if (!HAS_PROXY) {
                onFail("proxy_not_configured");
                return;
            }

            // 取消上一個輪詢
            if (currentPollTimer) {
                clearTimeout(currentPollTimer);
                currentPollTimer = null;
                console.log("🛑 已取消上一個輪詢");
            }
            var myRequestId = ++currentRequestId;

            console.log("🤖 發送消息到 Minds...");
            var messageText = "[source: webapp | tz: Asia/Hong_Kong]\n" + prompt;
            var headers = { "Content-Type": "application/json", "X-Auth-Token": MINDS_KEY };

            // 第一步：獲取發送前最新 AI 回覆的時間戳作為基準
            fetch(PROXY_BASE + "/minds/reply", { method: "POST", headers: headers })
            .then(function(r) { return r.json(); })
            .then(function(beforeData) {
                var beforeCreatedAt = beforeData.createdAt || "";
                console.log("📋 發送前基準時間:", beforeCreatedAt);

                // 第二步：發送消息
                return fetch(PROXY_BASE + "/minds/send", {
                    method: "POST",
                    headers: headers,
                    body: JSON.stringify({ mindId: MIND_ID, messageText: messageText })
                })
                .then(function(r) {
                    console.log("📡 發送狀態:", r.status);
                    return r.text().then(function(text) {
                        if (!r.ok) throw new Error("Send failed: " + text);
                        return JSON.parse(text);
                    });
                })
                .then(function() {
                    // 第三步：用時間戳輪詢新回覆
                    console.log("✅ 消息已發送，開始輪詢回覆...");
                    var attempts = 0;
                    var maxAttempts = 60; // 60 * 5秒 = 300秒

                    function pollReply() {
                        // 如果被新請求取代，停止輪詢
                        if (myRequestId !== currentRequestId) {
                            console.log("🛑 輪詢被新請求取代，停止");
                            return;
                        }

                        attempts++;
                        fetch(PROXY_BASE + "/minds/reply", { method: "POST", headers: headers })
                        .then(function(r) { return r.json(); })
                        .then(function(data) {
                            var reply = data.reply || "";
                            var createdAt = data.createdAt || "";
                            console.log("📡 輪詢 #" + attempts + ", 時間:", createdAt, ", 長度:", reply.length);

                            // 用時間戳判斷是否為新回覆
                            if (reply && createdAt && createdAt !== beforeCreatedAt) {
                                console.log("✅ 收到新 AI 回覆，時間:", createdAt);
                                currentPollTimer = null;
                                onSuccess(reply);
                            } else if (attempts < maxAttempts) {
                                currentPollTimer = setTimeout(pollReply, 5000);
                            } else {
                                currentPollTimer = null;
                                onFail("timeout");
                            }
                        })
                        .catch(function(e) {
                            console.warn("⚠️ 輪詢錯誤:", e.message);
                            if (attempts < maxAttempts) {
                                currentPollTimer = setTimeout(pollReply, 5000);
                            } else {
                                currentPollTimer = null;
                                onFail("minds_error", e.message);
                            }
                        });
                    }

                    currentPollTimer = setTimeout(pollReply, 5000);
                });
            })
            .catch(function(e) {
                console.warn("⚠️ 失敗:", e.message);
                currentPollTimer = null;
                onFail("minds_error", e.message);
            });
        }

        // 🔥 當前遊戲
        function onHotClick() {
            console.log("🎯 當前遊戲按鈕被點擊");
            var mode = document.getElementById("styleSelect").value;
            var weight = document.getElementById("weightSelect").value;
            var isHot = mode === "high";
            var top = getTopWeight();

            if (!HAS_PROXY) { showError("proxy_not_configured", null); return; }

            var prompt = "";
            var modeLabel = "";
            var statusColor = "";
            var statusText = "";

            if (isHot) {
                modeLabel = "高觀看率爆款";
                statusColor = "#66c0f4";
                statusText = "🎮 <strong>[Steam 熱門榜]</strong> Minds AI 已搜尋當前在線人數最高的遊戲";
                prompt = "你是一個遊戲內容創作助手。請搜尋並列出目前 Steam 平台上在線人數最高的熱門遊戲（前5名），";
                prompt += "包括遊戲名稱、大約在線人數、遊戲類型。\n\n";
                prompt += "然後，從中挑選1款最適合做" + modeLabel + "影片的遊戲，";
                prompt += "並根據以下資訊生成完整的影片企劃：\n\n";
                prompt += "- 我的頻道目前權重最高的遊戲類型是「" + top.name + "」（權重值：" + top.weight.toFixed(1) + "）\n";
                prompt += "- 內容風格：" + modeLabel + "\n\n";
                prompt += "請輸出以下內容：\n";
                prompt += "1. Steam 熱門榜 Top 5（遊戲名 + 在線人數 + 類型）\n";
                prompt += "2. 推薦遊戲及推薦理由\n";
                prompt += "3. 3個YouTube爆款標題（按照" + modeLabel + "風格）\n";
                prompt += "4. 一個30秒的影片開場Hook講稿\n";
                prompt += "5. 影片大綱（3-5個重點段落）\n\n";
                prompt += "請用繁體中文回答，格式要清晰，有標題和分隔線，方便直接拿去做影片。";
            } else {
                modeLabel = "冷門好評單機";
                statusColor = "#34d399";
                statusText = "💎 <strong>[冷門好評單機]</strong> Minds AI 已搜尋在線人數少但好評率極高的單機遊戲";
                prompt = "你是一個遊戲內容創作助手。請搜尋目前 Steam 平台上在線人數較少（小眾）但好評率極高（壓倒性好評/特別好評）的單機遊戲（前5名），";
                prompt += "包括遊戲名稱、大約在線人數、Steam 好評率、遊戲類型、發售年份。\n\n";
                prompt += "重點：必須是在線人數不多、屬於小眾冷門，但玩家評價極高的單機遊戲，不要推薦大作或熱門遊戲。\n\n";
                prompt += "然後，從中挑選1款最適合做影片企劃的遊戲，";
                prompt += "並根據以下資訊生成完整的影片企劃：\n\n";
                prompt += "- 我的頻道目前權重最高的遊戲類型是「" + top.name + "」（權重值：" + top.weight.toFixed(1) + "）\n";
                prompt += "- 內容風格：深度挖掘、推坑向、強調\"被低估的寶藏\"\n\n";
                prompt += "請輸出以下內容：\n";
                prompt += "1. 冷門好評單機 Top 5（遊戲名 + 在線人數 + 好評率 + 類型 + 年份）\n";
                prompt += "2. 最推薦的遊戲及推薦理由（為什麼被低估、為什麼值得做影片）\n";
                prompt += "3. 3個YouTube標題（推坑/深度挖掘風格，強調\"少有人知但神作\"）\n";
                prompt += "4. 一個30秒的影片開場Hook講稿\n";
                prompt += "5. 影片大綱（3-5個重點段落）\n\n";
                prompt += "請用繁體中文回答，格式要清晰，有標題和分隔線，方便直接拿去做影片。";
            }

            showLoading((isHot ? "🤖 Minds AI 正在搜尋 Steam 熱門遊戲..." : "💎 Minds AI 正在搜尋冷門好評單機遊戲...") + "\n（可能需要 10-60 秒，最長等待 300 秒）");

            callMinds(prompt,
                function(text) {
                    if (weight !== "none") { updateWeight(isHot ? "Steam熱門遊戲" : "冷門好評單機", weight); }
                    var prefix = '<div class="status-bar" style="border-color: ' + statusColor + '; color: ' + statusColor + ';">';
                    prefix += statusText;
                    prefix += '</div>\n';
                    prefix += '<div class="status-bar">🔍 <strong>[權重參考]</strong> 權重最高類型: <strong>' + top.name + ' (' + top.weight.toFixed(1) + ')</strong></div>\n\n';
                    showOutput(prefix + text);
                },
                function(errorType, detail) {
                    showError(errorType, onHotClick, detail);
                }
            );
        }

        // 🚀 即將推出
        function onUpcomingClick() {
            console.log("🎯 即將推出按鈕被點擊");
            var mode = document.getElementById("styleSelect").value;
            var weight = document.getElementById("weightSelect").value;
            var isHot = mode === "high";
            var top = getTopWeight();

            if (!HAS_PROXY) { showError("proxy_not_configured", null); return; }

            var prompt = "";
            var modeLabel = "";
            var statusColor = "";
            var statusText = "";

            if (isHot) {
                modeLabel = "高觀看率爆款";
                statusColor = "#c084fc";
                statusText = "🚀 <strong>[Steam 即將推出]</strong> Minds AI 已搜尋高討論度遊戲";
                prompt = "你是一個遊戲內容創作助手。請搜尋 Steam 平台上即將推出（未來3-6個月內發售）的遊戲，";
                prompt += "找出目前討論度最高、最有爆款潛力的3款遊戲。\n\n";
                prompt += "對於每款遊戲，請提供：\n";
                prompt += "- 遊戲名稱\n";
                prompt += "- 預計發售日期\n";
                prompt += "- 遊戲類型\n";
                prompt += "- 為什麼討論度高（社群熱度、期待值、開發商背景等）\n\n";
                prompt += "然後，從中挑選1款最適合做" + modeLabel + "影片的遊戲，";
                prompt += "並根據以下資訊生成完整的影片企劃：\n\n";
                prompt += "- 我的頻道目前權重最高的遊戲類型是「" + top.name + "」（權重值：" + top.weight.toFixed(1) + "）\n";
                prompt += "- 內容風格：" + modeLabel + "\n\n";
                prompt += "請輸出以下內容：\n";
                prompt += "1. 即將推出的高討論度遊戲 Top 3（遊戲名 + 發售日期 + 類型 + 討論度原因）\n";
                prompt += "2. 最推薦的遊戲及推薦理由\n";
                prompt += "3. 3個YouTube爆款標題（按照" + modeLabel + "風格）\n";
                prompt += "4. 一個30秒的影片開場Hook講稿\n";
                prompt += "5. 影片大綱（3-5個重點段落）\n\n";
                prompt += "請用繁體中文回答，格式要清晰，有標題和分隔線，方便直接拿去做影片。";
            } else {
                modeLabel = "冷門好評單機";
                statusColor = "#34d399";
                statusText = "💎 <strong>[即將推出冷門單機]</strong> Minds AI 已搜尋小眾但備受期待的單機遊戲";
                prompt = "你是一個遊戲內容創作助手。請搜尋 Steam 平台上即將推出（未來3-6個月內發售）的小眾單機遊戲，";
                prompt += "找出目前討論度不高但品質看起來極高、有潛力成為黑馬的3款單機遊戲。\n\n";
                prompt += "重點：必須是小眾、非大作、由獨立開發者或小團隊製作的單機遊戲，不要推薦 3A 大作或高討論度遊戲。\n\n";
                prompt += "對於每款遊戲，請提供：\n";
                prompt += "- 遊戲名稱\n";
                prompt += "- 預計發售日期\n";
                prompt += "- 遊戲類型\n";
                prompt += "- 開發團隊背景\n";
                prompt += "- 為什麼值得期待（美術、玩法、創新點等）\n\n";
                prompt += "然後，從中挑選1款最適合做影片企劃的遊戲，";
                prompt += "並根據以下資訊生成完整的影片企劃：\n\n";
                prompt += "- 我的頻道目前權重最高的遊戲類型是「" + top.name + "」（權重值：" + top.weight.toFixed(1) + "）\n";
                prompt += "- 內容風格：深度挖掘、推坑向、強調\"可能被錯過的黑馬\"\n\n";
                prompt += "請輸出以下內容：\n";
                prompt += "1. 即將推出的冷門單機 Top 3（遊戲名 + 發售日期 + 類型 + 開發團隊 + 期待理由）\n";
                prompt += "2. 最推薦的遊戲及推薦理由\n";
                prompt += "3. 3個YouTube標題（推坑/深度挖掘風格，強調\"低調但可能是神作\"）\n";
                prompt += "4. 一個30秒的影片開場Hook講稿\n";
                prompt += "5. 影片大綱（3-5個重點段落）\n\n";
                prompt += "請用繁體中文回答，格式要清晰，有標題和分隔線，方便直接拿去做影片。";
            }

            showLoading((isHot ? "🚀 Minds AI 正在搜尋即將推出的熱門遊戲..." : "💎 Minds AI 正在搜尋即將推出的冷門單機遊戲...") + "\n（可能需要 10-60 秒，最長等待 300 秒）");

            callMinds(prompt,
                function(text) {
                    if (weight !== "none") { updateWeight(isHot ? "即將推出遊戲" : "即將推出冷門單機", weight); }
                    var prefix = '<div class="status-bar" style="border-color: ' + statusColor + '; color: ' + statusColor + ';">';
                    prefix += statusText;
                    prefix += '</div>\n';
                    prefix += '<div class="status-bar">🔍 <strong>[權重參考]</strong> 權重最高類型: <strong>' + top.name + ' (' + top.weight.toFixed(1) + ')</strong></div>\n\n';
                    showOutput(prefix + text);
                },
                function(errorType, detail) {
                    showError(errorType, onUpcomingClick, detail);
                }
            );
        }

        console.log("✅ 腳本加載完成，代理狀態：" + (HAS_PROXY ? "已配置 ✅" : "未配置 ⚠️"));
    </script>
</body>
</html>
