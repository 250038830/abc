<html lang="zh-TW">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Viral Game Content Agent</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #030712;
            color: #f3f4f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 16px;
            box-sizing: border-box;
        }
        .container {
            max-width: 460px;
            width: 100%;
            background-color: #0b1329;
            border: 1px solid #1e293b;
            border-radius: 20px;
            padding: 32px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5), 0 0 30px rgba(59, 130, 246, 0.15);
            text-align: center;
            box-sizing: border-box;
        }
        h1 {
            font-size: 26px;
            font-weight: 800;
            margin-top: 0;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #38bdf8 0%, #818cf8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .desc {
            font-size: 14px;
            color: #9ca3af;
            margin-bottom: 28px;
            line-height: 1.5;
        }
        .label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #9fa8b6;
            margin-bottom: 8px;
            text-align: left;
        }
        select.input-field {
            width: 100%;
            background: #111827;
            border: 1px solid #374151;
            border-radius: 10px;
            padding: 14px;
            color: white;
            font-size: 14px;
            box-sizing: border-box;
            margin-bottom: 16px;
            outline: none;
            cursor: pointer;
        }
        .btn {
            width: 100%;
            color: white;
            border: none;
            border-radius: 10px;
            padding: 16px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            margin-bottom: 12px;
            box-sizing: border-box;
            transition: all 0.2s;
        }
        .btn:hover { transform: translateY(-1px); }
        .btn-hot { background: linear-gradient(135deg, #ef4444, #f97316); }
        .btn-hot:hover { box-shadow: 0 4px 20px rgba(239, 68, 68, 0.4); }
        .btn-upcoming { background: linear-gradient(135deg, #a855f7, #6366f1); }
        .btn-upcoming:hover { box-shadow: 0 4px 20px rgba(168, 85, 247, 0.4); }
        .hint {
            font-size: 12px;
            color: #6b7280;
            line-height: 1.4;
            margin-top: -4px;
            margin-bottom: 24px;
            text-align: left;

        .btn-hint {
            font-size: 11px;
            color: rgba(255,255,255,0.7);
            margin-top: 4px;
            font-weight: 400;
        }
        .output-box {
            display: none;
            background: #070b14;
            border: 1px solid rgba(56, 189, 248, 0.3);
            border-radius: 12px;
            padding: 20px;
            margin-top: 20px;
            box-shadow: inset 0 4px 10px rgba(0,0,0,0.8);
            text-align: left;
        }
        .output-header {
            display: flex;
            align-items: center;
            color: #38bdf8;
            font-weight: 700;

        .output-badge {
            background: rgba(3, 105, 161, 0.4);
            color: #38bdf8;
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 4px;
            margin-left: auto;
        }
        .output-content {
            font-size: 14px;
            color: #e2e8f0;
            line-height: 1.6;
            white-space: pre-wrap;
        }
        .status-bar {
            font-size: 12px;
            color: #38bdf8;
            background: #111827;
            padding: 6px 12px;
            border-radius: 6px;
            margin-bottom: 14px;
            border: 1px solid #1e293b;
            display: inline-block;
        }
        .loading {
            color: #eab308;
            font-weight: bold;
            display: none;
            margin-top: 15px;
            text-align: center;
            font-size: 14px;
        }
        .steam-tag {
            display: inline-block;
            background: linear-gradient(135deg, #1b2838, #2a475e);
            color: #66c0f4;
            font-size: 10px;
            padding: 2px 8px;
            border-radius: 4px;
            margin-left: 6px;
            font-weight: 600;
            border: 1px solid #66c0f4;
        }
        .upcoming-tag {
            display: inline-block;
            background: linear-gradient(135deg, #581c87, #7e22ce);
            color: #e9d5ff;
            font-size: 10px;
            padding: 2px 8px;
            border-radius: 4px;
            margin-left: 6px;
            font-weight: 600;
            border: 1px solid #a855f7;
        }
        .divider {
            display: flex;
            align-items: center;
            margin: 20px 0;
            color: #4b5563;
            font-size: 12px;
        }
        .divider::before, .divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background: #1e293b;
        }
        .divider span { padding: 0 12px; }
        .proxy-status {
            font-size: 11px;
            padding: 8px 12px;
            border-radius: 6px;
            margin-bottom: 16px;
            text-align: left;
            word-break: break-all;
        }
        .proxy-ok { background: rgba(16, 185, 129, 0.1); color: #10b981; border: 1px solid rgba(16, 185, 129, 0.3); }
        .proxy-no { background: rgba(239, 68, 68, 0.1); color: #f43f5e; border: 1px solid rgba(239, 68, 68, 0.3); }
        .error-box {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.4);
            border-radius: 10px;
            padding: 16px;
            margin-top: 10px;
        }
        .error-title { color: #f43f5e; font-weight: bold; font-size: 15px; margin-bottom: 8px; }
        .error-text { color: #fca5a5; font-size: 13px; line-height: 1.6; }
        .error-retry {
            margin-top: 12px;
            background: #ef4444;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
        }
        .error-retry:hover { background: #dc2626; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Viral Game Content Agent</h1>
        <div class="desc">Track 1: Audience Growth. Powered 100% by Minds AI.</div>
        <div id="proxyStatus" class="proxy-status proxy-no">⚠️ 代理未配置，請在代碼中填入 YOUR_WORKER_URL</div>

        <label class="label">內容風格</label>
        <select id="styleSelect" class="input-field">
            <option value="high">🔥 爆款路線（毒舌共鳴）</option>
            <option value="low">🧊 冷門分析（深度挖掘）</option>
        </select>
        <div class="hint">決定講稿和標題的風格方向</div>

        <label class="label">影片表現反饋</label>
        <select id="weightSelect" class="input-field">
            <option value="up">📈 表現好（權重 +0.5）</option>
            <option value="down">📉 表現差（權重 -0.3）</option>
            <option value="none">➖ 不調整</option>
        </select>
        <div class="hint">根據你實際影片數據反饋，影響後續推薦優先級</div>

        <div class="divider"><span>選擇搜尋模式</span></div>

        <button type="button" class="btn btn-hot" onclick="onHotClick()">
            🔥 當前 Steam 熱門榜
            <div class="btn-hint">Minds AI 搜尋現在最多人玩的遊戲</div>
        </button>

        <button type="button" class="btn btn-upcoming" onclick="onUpcomingClick()">
            🚀 即將推出的熱門遊戲
            <div class="btn-hint">Minds AI 搜尋未來上市的高討論度遊戲</div>
        </button>

        <div id="loading" class="loading">⏳ 處理中...</div>

        <div id="outputBox" class="output-box">
            <div class="output-header">
                <span>🤖 MINDS AI 輸出結果</span>
                <span class="output-badge">LIVE API</span>
            </div>
            <div id="outputContent" class="output-content"></div>
        </div>
    </div>

    <script>
        console.log("0️⃣ 腳本開始加載...");

        // ============================================
        // 👇 Cloudflare Worker URL
        // ============================================
        var PROXY_BASE = "https://winter-disk-958a.chunyin743.workers.dev";
        // ============================================

        // ✅ 最新的 auth_token（從 Cookie 抓取）
        var MINDS_KEY = "eyJ0eXAiOiJKV1QiLCJhbGciOiJFUzI1NiIsImtpZCI6ImFybjphd3M6a21zOmFwLW5vcnRoZWFzdC0xOjYyODg4NDA0NTY0NTprZXkvODgwODA0ZjQtNTc4ZC00ZGY3LThkYWQtMmQ5ODg2Y2M5MmZmIn0.eyJlbWFpbCI6ImNodW55aW43NDNAZ21haWwuY29tIiwiaHVtYW5JZCI6IjRlZGI0MzNlLWYzNmItMTQxMC04NDY2LTAwMDM5Y2U3ZGYxMSIsInJvbGUiOiJ1c2VyIiwidmVyc2lvbiI6MywiaXNzIjoidXNlbWluZHMtYmFja2VuZC1hdXRoZW50aWNhdGlvbiIsImlhdCI6MTc4Njk1MjY5MCwiZXhwIjoxNzk0NzI4Njg5LCJzdWIiOiJjaHVueWluNzQzQGdtYWlsLmNvbSJ9.wkdjz9fHp7nZLn0dI3nz-8xtKrF6fWVVwKgv3uwjK6FAgeHy7Oxg8aMDbtl9t_m26iGYz1IKs9ipOELApCTg2g";

        var MIND_ID = "64db433e-f36b-1410-8466-00039ce7df11";

        // 檢查代理是否配置
        var HAS_PROXY = PROXY_BASE && PROXY_BASE !== "YOUR_WORKER_URL" && PROXY_BASE.length > 10;
        if (HAS_PROXY) {
            document.getElementById("proxyStatus").className = "proxy-status proxy-ok";
            document.getElementById("proxyStatus").textContent = "✅ 代理已配置：" + PROXY_BASE;
        }
        console.log("1️⃣ 代理狀態：" + (HAS_PROXY ? "已配置 ✅ " + PROXY_BASE : "未配置 ⚠️"));

        // === 權重系統 ===
        var DEFAULT_WEIGHTS = { "魂系": 1.5, "動作": 1.0, "射擊": 0.5, "卡牌": 0.0 };
        var gameWeights = {};

        try {
            var saved = localStorage.getItem("gameWeights");
            if (saved) {
                var parsed = JSON.parse(saved);
                for (var k in DEFAULT_WEIGHTS) { gameWeights[k] = DEFAULT_WEIGHTS[k]; }
                for (var k2 in parsed) { gameWeights[k2] = parsed[k2]; }
            } else {
                for (var k3 in DEFAULT_WEIGHTS) { gameWeights[k3] = DEFAULT_WEIGHTS[k3]; }
            }
        } catch(e) {
            for (var k4 in DEFAULT_WEIGHTS) { gameWeights[k4] = DEFAULT_WEIGHTS[k4]; }
        }

        function saveWeights() {
            try { localStorage.setItem("gameWeights", JSON.stringify(gameWeights)); } catch(e) {}
        }

        function detectType(game) {
            if (!game || typeof game !== "string") return "動作";
            var g = game.toLowerCase();
            if (g.indexOf("悟空") >= 0 || g.indexOf("魂") >= 0 || g.indexOf("艾爾登") >= 0 || g.indexOf("隻狼") >= 0 || g.indexOf("elden") >= 0 || g.indexOf("black myth") >= 0) return "魂系";
            if (g.indexOf("射擊") >= 0 || g.indexOf("fps") >= 0 || g.indexOf("cod") >= 0 || g.indexOf("cs") >= 0 || g.indexOf("apex") >= 0 || g.indexOf("valorant") >= 0 || g.indexOf("counter-strike") >= 0 || g.indexOf("pubg") >= 0) return "射擊";
            if (g.indexOf("卡牌") >= 0 || g.indexOf("爐石") >= 0 || g.indexOf("hearthstone") >= 0 || g.indexOf("pokemon") >= 0) return "卡牌";
            return "動作";
        }

        function updateWeight(game, feedback) {
            var type = detectType(game);
            if (feedback === "up") { gameWeights[type] += 0.5; }
            else if (feedback === "down") { gameWeights[type] = Math.max(0, gameWeights[type] - 0.3); }
            saveWeights();
            return { type: type, weight: gameWeights[type], feedback: feedback };
        }

        function getTopWeight() {
            var maxKey = "動作", maxVal = 0;
            for (var k in gameWeights) {
                if (gameWeights[k] > maxVal) { maxVal = gameWeights[k]; maxKey = k; }
            }
            return { name: maxKey, weight: maxVal };
        }

        // === UI 函數 ===
        function showLoading(text) {
            var el = document.getElementById("loading");
            el.style.display = "block";
            el.textContent = text || "⏳ 處理中...";
            document.getElementById("outputBox").style.display = "none";
        }

        function showOutput(html) {
            document.getElementById("loading").style.display = "none";
            document.getElementById("outputBox").style.display = "block";
            document.getElementById("outputContent").innerHTML = html;
        }

        // ✅ 改進的錯誤顯示（顯示真實錯誤信息）
        function showError(errorType, retryFunc, errorDetail) {
            document.getElementById("loading").style.display = "none";
            document.getElementById("outputBox").style.display = "block";

            var errorMsg = "";
            var errorText = "";

            if (errorType === "proxy_not_configured") {
                errorMsg = "代理未配置";
                errorText = "請在代碼中將 PROXY_BASE 設置為你的 Cloudflare Worker URL，然後重新上傳到 GitHub。";
            } else if (errorType === "network_error") {
                errorMsg = "網絡連接失敗";
                errorText = "無法連接到 Cloudflare Worker 代理。請檢查 Worker URL 是否正確、Worker 是否正常運行。";
            } else if (errorType === "empty_response") {
                errorMsg = "Minds 返回空結果";
                errorText = "Minds API 已響應，但返回內容為空。請稍後重試。";
            } else if (errorType === "minds_error") {
                errorMsg = "Minds API 調用失敗";
                errorText = "錯誤詳情：<br><code style='background:#111;padding:4px 8px;border-radius:4px;font-size:12px;word-break:break-all;display:inline-block;margin-top:4px;'>" + (errorDetail || "未知錯誤") + "</code>";
            } else {
                errorMsg = "未知錯誤";
                errorText = "發生未知錯誤，請稍後重試。";
            }

            var retryBtnId = "retryBtn_" + Date.now();
            var html = '<div class="error-box">';
            html += '<div class="error-title">❌ ' + errorMsg + '</div>';
            html += '<div class="error-text">' + errorText + '</div>';
            if (retryFunc) {
                html += '<button class="error-retry" id="' + retryBtnId + '" onclick="(' + retryFunc.toString() + ')()">🔄 重新嘗試</button>';
            }
            html += '</div>';
            document.getElementById("outputContent").innerHTML = html;
        }

        // ✅ 改進的 callMinds（不需要 alias，Worker 自動獲取）
        function callMinds(prompt, onSuccess, onFail) {
            if (!HAS_PROXY) {
                console.log("⚠️ 未配置代理，Minds 無法調用");
                onFail("proxy_not_configured");
                return;
            }

            console.log("🤖 通過 Worker 調用 Minds API...");
            console.log("📝 Prompt:", prompt.substring(0, 200) + "...");

            var messageText = "[source: webapp | tz: Asia/Hong_Kong]\n" + prompt;

            fetch(PROXY_BASE + "/minds", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "X-Auth-Token": MINDS_KEY
                },
                body: JSON.stringify({
                    mindId: MIND_ID,
                    messageText: messageText
                })
            })
            .then(function(r) {
                console.log("📡 Minds Worker 響應狀態:", r.status);
                return r.text().then(function(text) {
                    console.log("📡 Minds 返回原始內容:", text.substring(0, 800));
                    if (!r.ok) {
                        throw new Error("HTTP " + r.status + ": " + text);
                    }
                    try {
                        return JSON.parse(text);
                    } catch(e) {
                        return { raw: text };
                    }
                });
            })
            .then(function(data) {
                console.log("📡 Minds 返回數據:", JSON.stringify(data).substring(0, 500));
                var text = data.reply || data.text || data.message || data.output || data.messageText || data.content || data.response || data.raw || "";
                if (text) {
                    console.log("✅ Minds API 調用成功，內容長度:", text.length);
                    onSuccess(text);
                } else {
                    console.warn("⚠️ Minds 返回內容為空");
                    onFail("empty_response");
                }
            })
            .catch(function(e) {
                console.warn("⚠️ Minds Worker 調用失敗:", e.message);
                onFail("minds_error", e.message);
            });
        }

        // 🔥 當前 Steam 熱門榜
        function onHotClick() {
            console.log("🎯 熱門榜按鈕被點擊");
            var style = document.getElementById("styleSelect").value;
            var weight = document.getElementById("weightSelect").value;
            var isHigh = style === "high";
            var styleLabel = isHigh ? "高觀看率爆款" : "低觀看率冷門";

            if (!HAS_PROXY) { showError("proxy_not_configured", null); return; }

            var top = getTopWeight();

            var prompt = "你是一個遊戲內容創作助手。請搜尋並列出目前 Steam 平台上在線人數最高的熱門遊戲（前5名），";
            prompt += "包括遊戲名稱、大約在線人數、遊戲類型。\n\n";
            prompt += "然後，從中挑選1款最適合做" + styleLabel + "影片的遊戲，";
            prompt += "並根據以下資訊生成完整的影片企劃：\n\n";
            prompt += "- 我的頻道目前權重最高的遊戲類型是「" + top.name + "」（權重值：" + top.weight.toFixed(1) + "）\n";
            prompt += "- 內容風格：" + styleLabel + "\n\n";
            prompt += "請輸出以下內容：\n";
            prompt += "1. Steam 熱門榜 Top 5（遊戲名 + 在線人數 + 類型）\n";
            prompt += "2. 推薦遊戲及推薦理由\n";
            prompt += "3. 3個YouTube爆款標題（按照" + styleLabel + "風格）\n";
            prompt += "4. 一個30秒的影片開場Hook講稿\n";
            prompt += "5. 影片大綱（3-5個重點段落）\n\n";
            prompt += "請用繁體中文回答，格式要清晰，有標題和分隔線，方便直接拿去做影片。";

            showLoading("🤖 Minds AI 正在搜尋 Steam 熱門遊戲...");

            callMinds(prompt,
                function(text) {
                    if (weight !== "none") { updateWeight("Steam熱門遊戲", weight); }
                    var prefix = '<div class="status-bar" style="border-color: #66c0f4; color: #66c0f4;">';
                    prefix += '🎮 <strong>[Steam 熱門榜]</strong> Minds AI 已搜尋當前在線人數最高的遊戲';
                    prefix += '<span class="steam-tag">MINDS AI</span></div>\n';
                    prefix += '<div class="status-bar">🔍 <strong>[權重參考]</strong> 權重最高類型: <strong>' + top.name + ' (' + top.weight.toFixed(1) + ')</strong></div>\n\n';
                    showOutput(prefix + text);
                },
                function(errorType, detail) {
                    showError(errorType, onHotClick, detail);
                }
            );
        }

        // 🚀 即將推出的熱門遊戲
        function onUpcomingClick() {
            console.log("🎯 即將推出按鈕被點擊");
            var style = document.getElementById("styleSelect").value;
            var weight = document.getElementById("weightSelect").value;
            var isHigh = style === "high";
            var styleLabel = isHigh ? "高觀看率爆款" : "低觀看率冷門";

            if (!HAS_PROXY) { showError("proxy_not_configured", null); return; }

            var top = getTopWeight();

            var prompt = "你是一個遊戲內容創作助手。請搜尋 Steam 平台上即將推出（未來3-6個月內發售）的遊戲，";
            prompt += "找出目前討論度最高、最有爆款潛力的3款遊戲。\n\n";
            prompt += "對於每款遊戲，請提供：\n";
            prompt += "- 遊戲名稱\n";
            prompt += "- 預計發售日期\n";
            prompt += "- 遊戲類型\n";
            prompt += "- 為什麼討論度高（社群熱度、期待值、開發商背景等）\n\n";
            prompt += "然後，從中挑選1款最適合做" + styleLabel + "影片的遊戲，";
            prompt += "並根據以下資訊生成完整的影片企劃：\n\n";
            prompt += "- 我的頻道目前權重最高的遊戲類型是「" + top.name + "」（權重值：" + top.weight.toFixed(1) + "）\n";
            prompt += "- 內容風格：" + styleLabel + "\n\n";
            prompt += "請輸出以下內容：\n";
            prompt += "1. 即將推出的高討論度遊戲 Top 3（遊戲名 + 發售日期 + 類型 + 討論度原因）\n";
            prompt += "2. 最推薦的遊戲及推薦理由\n";
            prompt += "3. 3個YouTube爆款標題（按照" + styleLabel + "風格）\n";
            prompt += "4. 一個30秒的影片開場Hook講稿\n";
            prompt += "5. 影片大綱（3-5個重點段落）\n\n";
            prompt += "請用繁體中文回答，格式要清晰，有標題和分隔線，方便直接拿去做影片。";

            showLoading("🚀 Minds AI 正在搜尋即將推出的熱門遊戲...");

            callMinds(prompt,
                function(text) {
                    if (weight !== "none") { updateWeight("即將推出遊戲", weight); }
                    var prefix = '<div class="status-bar" style="border-color: #a855f7; color: #c084fc;">';
                    prefix += '🚀 <strong>[Steam 即將推出]</strong> Minds AI 已搜尋高討論度遊戲';
                    prefix += '<span class="upcoming-tag">MINDS AI</span></div>\n';
                    prefix += '<div class="status-bar">🔍 <strong>[權重參考]</strong> 權重最高類型: <strong>' + top.name + ' (' + top.weight.toFixed(1) + ')</strong></div>\n\n';
                    showOutput(prefix + text);
                },
                function(errorType, detail) {
                    showError(errorType, onUpcomingClick, detail);
                }
            );
        }

        console.log("✅ 腳本加載完成，代理狀態：" + (HAS_PROXY ? "已配置 ✅" : "未配置 ⚠️"));
    </script>
</body>
</html>
