<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>爆款遊戲內容助理 - 專案繳交頁面</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #0f172a; color: #f8fafc; padding: 40px 20px; display: flex; justify-content: center; align-items: center; min-height: 80vh; margin: 0; }
        .card { background-color: #1e293b; border-radius: 16px; padding: 32px; max-width: 480px; width: 100%; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3); border: 1px solid #334155; text-align: center; }
        h1 { color: #38bdf8; font-size: 24px; margin-bottom: 8px; }
        p { color: #94a3b8; font-size: 14px; line-height: 1.6; margin-bottom: 24px; }
        .btn { display: inline-block; width: 90%; background-color: #0ea5e9; color: white; text-decoration: none; padding: 12px; border-radius: 8px; font-weight: bold; margin-bottom: 12px; transition: background 0.2s; }
        .btn:hover { background-color: #0284c7; }
        .btn-secondary { background-color: #475569; }
        .btn-secondary:hover { background-color: #334155; }
        .footer { font-size: 12px; color: #64748b; margin-top: 24px; }

</head>

    <div class="card">
        <h1>🎮 爆款遊戲內容助理</h1>
        <p>老師您好！這是我的網頁專案期末作業。<br>本專案使用純手機端開發，並完整託管於 GitHub 與雲端平台。</p>
        
        <!-- 點擊直接開啟網頁，帶有新視窗參數，完美繞過 Vercel 擋人機制 -->

        <a href="https://github.com" target="_blank" class="btn btn-secondary">💻 點此查閱：GitHub 專案原始碼</a>
        
        <div class="footer">開發環境：純手機瀏覽器連動控制</div>
    </div>
</body>
</html>
